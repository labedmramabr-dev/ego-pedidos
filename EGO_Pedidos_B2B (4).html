<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGO Panadería — Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #2d4a3e;
    --verde-claro: #3d6b58;
    --cafe: #7a5c3f;
    --pergamino: #f5f0e8;
    --pergamino-oscuro: #ede5d4;
    --texto: #1e1e1e;
    --gris: #888;
    --blanco: #fff;
    --sombra: 0 4px 24px rgba(45,74,62,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--pergamino);
    color: var(--texto);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #screen-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(145deg, var(--verde) 0%, var(--verde-claro) 100%);
  }

  .login-box {
    background: var(--pergamino);
    border-radius: 18px;
    padding: 48px 40px 40px;
    width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }

  .login-logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--verde);
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cafe);
    margin-bottom: 36px;
  }

  .login-box input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--pergamino-oscuro);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    background: var(--blanco);
    color: var(--texto);
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .login-box input:focus { border-color: var(--verde-claro); }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--verde);
    color: var(--blanco);
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }

  .btn-primary:hover { background: var(--verde-claro); }
  .btn-primary:active { transform: scale(0.98); }

  .login-error {
    color: #c0392b;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 20px;
  }

  /* ── APP SHELL ── */
  #screen-app { display: none; flex-direction: column; min-height: 100vh; }

  .topbar {
    background: var(--verde);
    color: var(--blanco);
    padding: 0 20px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .topbar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .topbar-right { display: flex; align-items: center; gap: 14px; }

  .topbar-user {
    font-size: 0.82rem;
    opacity: 0.8;
  }

  .cart-btn {
    background: var(--cafe);
    color: var(--blanco);
    border: none;
    border-radius: 20px;
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }

  .cart-btn:hover { background: #8d6b4a; }

  .cart-count {
    background: var(--blanco);
    color: var(--cafe);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .logout-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--blanco);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.2s;
  }

  .logout-btn:hover { background: rgba(255,255,255,0.1); }

  /* ── CATÁLOGO ── */
  #screen-catalogo {
    padding: 24px 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  .catalogo-header {
    margin-bottom: 20px;
  }

  .catalogo-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--verde);
  }

  .catalogo-header p {
    font-size: 0.85rem;
    color: var(--gris);
    margin-top: 2px;
  }

  .categoria-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--cafe);
    margin: 28px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--pergamino-oscuro);
    letter-spacing: 0.3px;
  }

  .productos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .producto-card {
    background: var(--blanco);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--sombra);
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .producto-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(45,74,62,0.13);
  }

  .producto-nombre {
    font-weight: 500;
    font-size: 0.92rem;
    line-height: 1.3;
    color: var(--texto);
  }

  .producto-precio {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    color: var(--verde);
    font-weight: 600;
  }

  .producto-unidad {
    font-size: 0.75rem;
    color: var(--gris);
    margin-top: -6px;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--verde-claro);
    background: var(--blanco);
    color: var(--verde);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }

  .qty-btn:hover { background: var(--verde); color: var(--blanco); }

  .qty-value {
    min-width: 28px;
    text-align: center;
    font-weight: 600;
    font-size: 0.95rem;
  }

  /* ── CARRITO MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--pergamino);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 24px 32px;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--verde);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--gris);
    line-height: 1;
  }

  .carrito-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--pergamino-oscuro);
    font-size: 0.9rem;
  }

  .carrito-item-nombre { flex: 1; }

  .carrito-item-qty {
    color: var(--gris);
    margin: 0 12px;
    white-space: nowrap;
  }

  .carrito-item-precio {
    font-weight: 600;
    color: var(--verde);
    min-width: 70px;
    text-align: right;
  }

  .carrito-item-del {
    background: none;
    border: none;
    color: #c0392b;
    cursor: pointer;
    font-size: 1rem;
    margin-left: 10px;
    opacity: 0.6;
  }

  .carrito-item-del:hover { opacity: 1; }

  .carrito-total {
    display: flex;
    justify-content: space-between;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--verde);
    margin-top: 16px;
    padding-top: 12px;
  }

  .carrito-vacio {
    text-align: center;
    color: var(--gris);
    padding: 32px 0;
    font-size: 0.9rem;
  }

  .notas-label {
    display: block;
    font-size: 0.82rem;
    color: var(--gris);
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .notas-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--pergamino-oscuro);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    resize: none;
    background: var(--blanco);
    outline: none;
  }

  .notas-input:focus { border-color: var(--verde-claro); }

  .btn-pedido {
    width: 100%;
    padding: 15px;
    background: var(--verde);
    color: var(--blanco);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-pedido:hover { background: var(--verde-claro); }
  .btn-pedido:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── CONFIRMACIÓN ── */
  #screen-confirmacion {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 40px 24px;
    background: var(--verde);
    color: var(--blanco);
  }

  .confirm-icon { font-size: 4rem; margin-bottom: 20px; }

  .confirm-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 12px;
  }

  .confirm-sub {
    font-size: 0.95rem;
    opacity: 0.8;
    max-width: 320px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn-wa {
    background: #25D366;
    color: var(--blanco);
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .btn-wa:hover { opacity: 0.9; }

  .btn-nuevo-pedido {
    background: rgba(255,255,255,0.15);
    color: var(--blanco);
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-nuevo-pedido:hover { background: rgba(255,255,255,0.25); }

  .confirm-btns { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* ── HISTORIAL ── */
  #screen-historial {
    display: none;
    padding: 24px 20px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
  }

  .historial-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .historial-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--verde);
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--verde);
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'DM Sans', sans-serif;
    padding: 0;
  }

  .pedido-card {
    background: var(--blanco);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--sombra);
  }

  .pedido-card-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .pedido-folio {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--verde);
  }

  .pedido-fecha {
    font-size: 0.8rem;
    color: var(--gris);
  }

  .pedido-items {
    font-size: 0.85rem;
    color: var(--gris);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .pedido-total-tag {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--cafe);
    font-weight: 600;
  }

  .historial-vacio {
    text-align: center;
    color: var(--gris);
    padding: 48px 0;
    font-size: 0.9rem;
  }

  /* ── NAV BOTTOM ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--blanco);
    border-top: 1px solid var(--pergamino-oscuro);
    display: flex;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    z-index: 99;
  }

  .nav-btn {
    flex: 1;
    padding: 12px 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    color: var(--gris);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--verde); }
  .nav-btn .nav-icon { font-size: 1.3rem; }

  .app-content { padding-bottom: 70px; }

  @media (min-width: 600px) {
    .bottom-nav { display: none; }
    .topbar { gap: 20px; }
    .app-content { padding-bottom: 20px; }
    #screen-catalogo, #screen-historial { padding: 32px 32px; }
  }

  /* ── ADMIN ── */
  #screen-admin {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    background: var(--pergamino);
  }

  .admin-topbar {
    background: var(--cafe);
    color: var(--blanco);
    padding: 0 24px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .admin-topbar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .admin-content {
    padding: 28px 24px;
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
  }

  .admin-section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--cafe);
    margin-bottom: 16px;
  }

  .admin-form {
    background: var(--blanco);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--sombra);
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .admin-form input {
    padding: 11px 14px;
    border: 1.5px solid var(--pergamino-oscuro);
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    background: var(--pergamino);
    transition: border-color 0.2s;
  }

  .admin-form input:focus { border-color: var(--cafe); }

  .admin-form .btn-add {
    grid-column: 1 / -1;
    padding: 12px;
    background: var(--cafe);
    color: var(--blanco);
    border: none;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .admin-form .btn-add:hover { background: #8d6b4a; }

  .admin-msg {
    grid-column: 1 / -1;
    font-size: 0.85rem;
    color: var(--verde-claro);
    min-height: 18px;
    text-align: center;
  }

  .cliente-row {
    background: var(--blanco);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--sombra);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .cliente-row-info { flex: 1; }

  .cliente-row-nombre {
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--texto);
  }

  .cliente-row-meta {
    font-size: 0.78rem;
    color: var(--gris);
    margin-top: 2px;
  }

  .btn-del-cliente {
    background: none;
    border: 1.5px solid #e74c3c;
    color: #e74c3c;
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .btn-del-cliente:hover { background: #e74c3c; color: var(--blanco); }

  .clientes-vacio {
    text-align: center;
    color: var(--gris);
    padding: 32px 0;
    font-size: 0.9rem;
  }

  .login-admin-link {
    margin-top: 14px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }

  .login-admin-link:hover { color: rgba(255,255,255,0.9); }
</style>
</head>
<body>

<!-- ════ LOGIN ════ -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-logo">EGO</div>
    <div class="login-sub">Panadería · Pedidos</div>
    <input type="text" id="login-user" placeholder="Usuario" autocomplete="off" />
    <input type="password" id="login-pass" placeholder="Contraseña" />
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
    <button class="login-admin-link" onclick="goAdmin()">⚙️ Acceso administrador</button>
  </div>
</div>

<!-- ════ ADMIN ════ -->
<div id="screen-admin">
  <div class="admin-topbar">
    <span class="admin-topbar-title">⚙️ EGO Admin — Clientes</span>
    <button class="logout-btn" onclick="salirAdmin()">Salir</button>
  </div>
  <div class="admin-content">
    <div class="admin-section-title">Agregar cliente</div>
    <div class="admin-form">
      <input type="text" id="a-nombre" placeholder="Nombre (ej: Zereno)" />
      <input type="text" id="a-usuario" placeholder="Usuario (ej: zereno)" autocomplete="off" />
      <input type="password" id="a-password" placeholder="Contraseña" autocomplete="off" />
      <input type="text" id="a-whatsapp" placeholder="WhatsApp (ej: 529981234567)" />
      <div class="admin-msg" id="admin-msg"></div>
      <button class="btn-add" onclick="agregarCliente()">+ Agregar cliente</button>
    </div>
    <div class="admin-section-title">Clientes registrados</div>
    <div id="admin-lista-clientes"></div>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="screen-app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-logo">EGO</div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="cart-btn" onclick="openCarrito()">
        🛒 Carrito <span class="cart-count" id="cart-count">0</span>
      </button>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="app-content">
    <!-- CATÁLOGO -->
    <div id="screen-catalogo">
      <div class="catalogo-header">
        <h2>Catálogo</h2>
        <p>Selecciona los productos y cantidades que necesitas</p>
      </div>
      <div id="catalogo-contenido"></div>
    </div>

    <!-- HISTORIAL -->
    <div id="screen-historial">
      <div class="historial-header">
        <h2>Mis Pedidos</h2>
      </div>
      <div id="historial-contenido"></div>
    </div>
  </div>

  <!-- Nav bottom (móvil) -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-catalogo" onclick="showTab('catalogo')">
      <span class="nav-icon">🍞</span>Catálogo
    </button>
    <button class="nav-btn" id="nav-historial" onclick="showTab('historial')">
      <span class="nav-icon">📋</span>Mis pedidos
    </button>
  </div>
</div>

<!-- ════ CARRITO MODAL ════ -->
<div class="modal-overlay" id="modal-carrito">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Tu pedido</h3>
      <button class="modal-close" onclick="closeCarrito()">✕</button>
    </div>
    <div id="carrito-items"></div>
    <label class="notas-label">Notas / comentarios</label>
    <textarea class="notas-input" id="pedido-notas" rows="3" placeholder="Ej: Sin azúcar al croissant, entregar antes de las 9am..."></textarea>
    <button class="btn-pedido" id="btn-confirmar" onclick="confirmarPedido()">
      ✅ Confirmar pedido
    </button>
  </div>
</div>

<!-- ════ CONFIRMACIÓN ════ -->
<div id="screen-confirmacion">
  <div class="confirm-icon">🎉</div>
  <div class="confirm-titulo">¡Pedido enviado!</div>
  <div class="confirm-sub" id="confirm-detalle"></div>
  <div class="confirm-btns">
    <a id="btn-wa-cliente" class="btn-wa" href="#" target="_blank">
      📲 Abrir WhatsApp
    </a>
    <button class="btn-nuevo-pedido" onclick="nuevoPedido()">Hacer otro pedido</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  CONFIGURACIÓN — edita aquí
// ══════════════════════════════════════════

// Número de WhatsApp EGO (con código de país, sin + ni espacios)
const WA_EGO = "529984573749";

// URL del Google Apps Script (despues de desplegarlo)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzN8s0oYfo-ajRk_n55rvorgITRglqLV1ULENGK3ibFHou79Sq3i-G_UMwKNsetrzbZ/exec";

// Contraseña del panel admin
const ADMIN_PASSWORD = "ego2024admin"; // ← CAMBIA ESTO

// Catálogo EGO Panadería
const CATALOGO = [
  {
    categoria: "Panes Artesanales",
    productos: [
      { id: "p01", nombre: "Pan de Masa Madre",        precio: 95,  unidad: "pieza" },
      { id: "p02", nombre: "Baguette",                 precio: 35,  unidad: "pieza" },
      { id: "p03", nombre: "Ciabatta",                 precio: 45,  unidad: "pieza" },
      { id: "p04", nombre: "Pan de Centeno",           precio: 90,  unidad: "pieza" },
      { id: "p05", nombre: "Pan Multigrano",           precio: 85,  unidad: "pieza" },
    ]
  },
  {
    categoria: "Bollería",
    productos: [
      { id: "b01", nombre: "Croissant Mantequilla",    precio: 38,  unidad: "pieza" },
      { id: "b02", nombre: "Pain au Chocolat",         precio: 42,  unidad: "pieza" },
      { id: "b03", nombre: "Concha",                   precio: 22,  unidad: "pieza" },
      { id: "b04", nombre: "Cuernito",                 precio: 22,  unidad: "pieza" },
      { id: "b05", nombre: "Danish de Frambuesa",      precio: 45,  unidad: "pieza" },
    ]
  },
  {
    categoria: "Tartas y Pasteles",
    productos: [
      { id: "t01", nombre: "Tarta de Limón",           precio: 320, unidad: "pieza" },
      { id: "t02", nombre: "Cheesecake New York",       precio: 360, unidad: "pieza" },
      { id: "t03", nombre: "Tarta de Frutos del Bosque",precio: 340, unidad: "pieza" },
    ]
  },
  {
    categoria: "Galletas y Bocados",
    productos: [
      { id: "g01", nombre: "Galletas de Avena y Pasas", precio: 18, unidad: "pieza" },
      { id: "g02", nombre: "Alfajor",                   precio: 28, unidad: "pieza" },
      { id: "g03", nombre: "Financier de Almendra",     precio: 32, unidad: "pieza" },
    ]
  },
];

// ══════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════
let currentUser = null;
let carrito = {};      // { id: { ...producto, qty } }
let historial = [];    // [ { folio, fecha, items, total, notas } ]
let ultimoPedido = null;

// ══════════════════════════════════════════
//  CLIENTES (localStorage)
// ══════════════════════════════════════════
function getClientes() {
  const saved = localStorage.getItem('ego_clientes');
  return saved ? JSON.parse(saved) : [];
}

function saveClientes(arr) {
  localStorage.setItem('ego_clientes', JSON.stringify(arr));
}

// ══════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════
function doLogin() {
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const clientes = getClientes();
  const cliente = clientes.find(c => c.usuario === u && c.password === p);
  if (!cliente) {
    document.getElementById('login-error').textContent = "Usuario o contraseña incorrectos.";
    return;
  }
  currentUser = cliente;
  const saved = localStorage.getItem('historial_' + u);
  historial = saved ? JSON.parse(saved) : [];
  document.getElementById('login-error').textContent = '';
  document.getElementById('topbar-user').textContent = cliente.nombre;
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display = 'flex';
  document.getElementById('screen-app').style.flexDirection = 'column';
  document.getElementById('screen-confirmacion').style.display = 'none';
  renderCatalogo();
  showTab('catalogo');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('screen-login').style.display !== 'none') doLogin();
});

function doLogout() {
  currentUser = null;
  carrito = {};
  historial = [];
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-confirmacion').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  updateCartCount();
}

// ══════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════
function showTab(tab) {
  document.getElementById('screen-catalogo').style.display = tab === 'catalogo' ? 'block' : 'none';
  document.getElementById('screen-historial').style.display = tab === 'historial' ? 'block' : 'none';
  document.getElementById('nav-catalogo').classList.toggle('active', tab === 'catalogo');
  document.getElementById('nav-historial').classList.toggle('active', tab === 'historial');
  if (tab === 'historial') renderHistorial();
}

// ══════════════════════════════════════════
//  CATÁLOGO
// ══════════════════════════════════════════
function renderCatalogo() {
  const cont = document.getElementById('catalogo-contenido');
  cont.innerHTML = '';
  CATALOGO.forEach(cat => {
    const tit = document.createElement('div');
    tit.className = 'categoria-titulo';
    tit.textContent = cat.categoria;
    cont.appendChild(tit);

    const grid = document.createElement('div');
    grid.className = 'productos-grid';
    cat.productos.forEach(prod => {
      const qty = carrito[prod.id]?.qty || 0;
      const card = document.createElement('div');
      card.className = 'producto-card';
      card.id = 'card-' + prod.id;
      card.innerHTML = `
        <div class="producto-nombre">${prod.nombre}</div>
        <div class="producto-precio">$${prod.precio.toFixed(2)}</div>
        <div class="producto-unidad">por ${prod.unidad}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="cambiarQty('${prod.id}', -1)">−</button>
          <span class="qty-value" id="qty-${prod.id}">${qty}</span>
          <button class="qty-btn" onclick="cambiarQty('${prod.id}', 1)">+</button>
        </div>
      `;
      grid.appendChild(card);
    });
    cont.appendChild(grid);
  });
}

function getProd(id) {
  for (const cat of CATALOGO) {
    const p = cat.productos.find(x => x.id === id);
    if (p) return p;
  }
  return null;
}

function cambiarQty(id, delta) {
  const prod = getProd(id);
  if (!prod) return;
  const actual = carrito[id]?.qty || 0;
  const nueva = Math.max(0, actual + delta);
  if (nueva === 0) {
    delete carrito[id];
  } else {
    carrito[id] = { ...prod, qty: nueva };
  }
  document.getElementById('qty-' + id).textContent = nueva;
  updateCartCount();
}

function updateCartCount() {
  const total = Object.values(carrito).reduce((s, i) => s + i.qty, 0);
  document.getElementById('cart-count').textContent = total;
}

// ══════════════════════════════════════════
//  CARRITO MODAL
// ══════════════════════════════════════════
function openCarrito() {
  renderCarritoModal();
  document.getElementById('modal-carrito').classList.add('active');
}

function closeCarrito() {
  document.getElementById('modal-carrito').classList.remove('active');
}

function renderCarritoModal() {
  const cont = document.getElementById('carrito-items');
  const items = Object.values(carrito);
  if (items.length === 0) {
    cont.innerHTML = '<div class="carrito-vacio">Tu carrito está vacío.<br>Agrega productos del catálogo.</div>';
    document.getElementById('btn-confirmar').disabled = true;
    return;
  }
  document.getElementById('btn-confirmar').disabled = false;
  let totalGlobal = 0;
  let html = '';
  items.forEach(item => {
    const subtotal = item.precio * item.qty;
    totalGlobal += subtotal;
    html += `
      <div class="carrito-item">
        <span class="carrito-item-nombre">${item.nombre}</span>
        <span class="carrito-item-qty">×${item.qty}</span>
        <span class="carrito-item-precio">$${subtotal.toFixed(2)}</span>
        <button class="carrito-item-del" onclick="eliminarDelCarrito('${item.id}')">✕</button>
      </div>
    `;
  });
  html += `<div class="carrito-total"><span>Total</span><span>$${totalGlobal.toFixed(2)}</span></div>`;
  cont.innerHTML = html;
}

function eliminarDelCarrito(id) {
  delete carrito[id];
  document.getElementById('qty-' + id).textContent = '0';
  updateCartCount();
  renderCarritoModal();
}

// ══════════════════════════════════════════
//  CONFIRMAR PEDIDO
// ══════════════════════════════════════════
function confirmarPedido() {
  const items = Object.values(carrito);
  if (items.length === 0) return;

  const notas = document.getElementById('pedido-notas').value.trim();
  const total = items.reduce((s, i) => s + i.precio * i.qty, 0);
  const folio = 'PED-' + Date.now().toString().slice(-6);
  const fecha = new Date().toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });

  ultimoPedido = { folio, fecha, cliente: currentUser.nombre, items, total, notas };

  // Guardar en historial local
  historial.unshift(ultimoPedido);
  localStorage.setItem('historial_' + currentUser.usuario, JSON.stringify(historial));

  // Enviar a Google Sheets (si está configurado)
  if (APPS_SCRIPT_URL) enviarASheets(ultimoPedido);

  // Armar mensajes WhatsApp
  const msgCliente = armarMensaje(ultimoPedido, false);
  const msgEGO     = armarMensaje(ultimoPedido, true);

  document.getElementById('btn-wa-cliente').href =
    `https://wa.me/${currentUser.whatsapp}?text=${encodeURIComponent(msgCliente)}`;

  // Guardar mensaje EGO para abrir después (o abrir automáticamente)
  window._waEGO = `https://wa.me/${WA_EGO}?text=${encodeURIComponent(msgEGO)}`;

  // Mostrar pantalla confirmación
  closeCarrito();
  document.getElementById('screen-app').style.display = 'none';
  const screen = document.getElementById('screen-confirmacion');
  screen.style.display = 'flex';
  screen.style.flexDirection = 'column';
  document.getElementById('confirm-detalle').textContent =
    `Pedido ${folio} · $${total.toFixed(2)} MXN\nSe notificará al equipo de EGO.`;

  // Abrir WA a EGO automáticamente
  setTimeout(() => { window.open(window._waEGO, '_blank'); }, 600);

  carrito = {};
  updateCartCount();
}

function armarMensaje(pedido, paraEGO) {
  const lineas = pedido.items.map(i => `  • ${i.nombre} ×${i.qty} — $${(i.precio * i.qty).toFixed(2)}`).join('\n');
  if (paraEGO) {
    return `🍞 *NUEVO PEDIDO — EGO Panadería*\n\n` +
      `📋 Folio: ${pedido.folio}\n` +
      `🏪 Cliente: ${pedido.cliente}\n` +
      `📅 Fecha: ${pedido.fecha}\n\n` +
      `*Productos:*\n${lineas}\n\n` +
      `💰 *Total: $${pedido.total.toFixed(2)} MXN*` +
      (pedido.notas ? `\n\n📝 Notas: ${pedido.notas}` : '');
  } else {
    return `Hola, gracias por tu pedido en *EGO Panadería* 🥐\n\n` +
      `Tu folio es *${pedido.folio}*\n\n` +
      `*Detalle:*\n${lineas}\n\n` +
      `💰 *Total: $${pedido.total.toFixed(2)} MXN*` +
      (pedido.notas ? `\n\n📝 Notas: ${pedido.notas}` : '') +
      `\n\nEn breve confirmaremos tu pedido. ¡Buen provecho!`;
  }
}

// ══════════════════════════════════════════
//  GOOGLE SHEETS
// ══════════════════════════════════════════
async function enviarASheets(pedido) {
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pedido)
    });
  } catch(e) {
    console.warn('No se pudo registrar en Sheets:', e);
  }
}

// ══════════════════════════════════════════
//  HISTORIAL
// ══════════════════════════════════════════
function renderHistorial() {
  const cont = document.getElementById('historial-contenido');
  if (historial.length === 0) {
    cont.innerHTML = '<div class="historial-vacio">Aún no tienes pedidos registrados.</div>';
    return;
  }
  cont.innerHTML = historial.map(p => `
    <div class="pedido-card">
      <div class="pedido-card-header">
        <span class="pedido-folio">${p.folio}</span>
        <span class="pedido-fecha">${p.fecha}</span>
      </div>
      <div class="pedido-items">${p.items.map(i => `${i.nombre} ×${i.qty}`).join(' · ')}</div>
      ${p.notas ? `<div class="pedido-items">📝 ${p.notas}</div>` : ''}
      <div class="pedido-total-tag">$${p.total.toFixed(2)} MXN</div>
    </div>
  `).join('');
}

// ══════════════════════════════════════════
//  NUEVO PEDIDO
// ══════════════════════════════════════════
function nuevoPedido() {
  document.getElementById('screen-confirmacion').style.display = 'none';
  document.getElementById('screen-app').style.display = 'flex';
  document.getElementById('screen-app').style.flexDirection = 'column';
  document.getElementById('pedido-notas').value = '';
  renderCatalogo();
  showTab('catalogo');
}

// ══════════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════════
function goAdmin() {
  const pass = prompt('Contraseña de administrador:');
  if (pass !== ADMIN_PASSWORD) {
    alert('Contraseña incorrecta.');
    return;
  }
  document.getElementById('screen-login').style.display = 'none';
  const adminScreen = document.getElementById('screen-admin');
  adminScreen.style.display = 'flex';
  adminScreen.style.flexDirection = 'column';
  renderAdminClientes();
}

function salirAdmin() {
  document.getElementById('screen-admin').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  // limpiar form
  ['a-nombre','a-usuario','a-password','a-whatsapp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('admin-msg').textContent = '';
}

function agregarCliente() {
  const nombre   = document.getElementById('a-nombre').value.trim();
  const usuario  = document.getElementById('a-usuario').value.trim().toLowerCase();
  const password = document.getElementById('a-password').value;
  const whatsapp = document.getElementById('a-whatsapp').value.trim().replace(/\D/g,'');
  const msg      = document.getElementById('admin-msg');

  if (!nombre || !usuario || !password || !whatsapp) {
    msg.style.color = '#e74c3c';
    msg.textContent = 'Completa todos los campos.';
    return;
  }

  const clientes = getClientes();
  if (clientes.find(c => c.usuario === usuario)) {
    msg.style.color = '#e74c3c';
    msg.textContent = 'Ese usuario ya existe.';
    return;
  }

  clientes.push({ nombre, usuario, password, whatsapp });
  saveClientes(clientes);

  msg.style.color = '#2d4a3e';
  msg.textContent = `✅ Cliente "${nombre}" agregado.`;
  ['a-nombre','a-usuario','a-password','a-whatsapp'].forEach(id => document.getElementById(id).value = '');
  renderAdminClientes();
}

function eliminarCliente(usuario) {
  if (!confirm(`¿Eliminar al cliente "${usuario}"?`)) return;
  const clientes = getClientes().filter(c => c.usuario !== usuario);
  saveClientes(clientes);
  renderAdminClientes();
}

function renderAdminClientes() {
  const cont = document.getElementById('admin-lista-clientes');
  const clientes = getClientes();
  if (clientes.length === 0) {
    cont.innerHTML = '<div class="clientes-vacio">No hay clientes registrados aún.</div>';
    return;
  }
  cont.innerHTML = clientes.map(c => `
    <div class="cliente-row">
      <div class="cliente-row-info">
        <div class="cliente-row-nombre">${c.nombre}</div>
        <div class="cliente-row-meta">Usuario: ${c.usuario} · WA: ${c.whatsapp}</div>
      </div>
      <button class="btn-del-cliente" onclick="eliminarCliente('${c.usuario}')">Eliminar</button>
    </div>
  `).join('');
}
</script>
</body>
</html>
