<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBFAF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eventos EGO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="icon" type="image/png" href="assets/icono-192.png">
<title>Eventos · EGO Grupo</title>
<style>
@font-face{font-family:'Fraunces';src:url('assets/fonts/Fraunces-Reg.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Fraunces';src:url('assets/fonts/Fraunces-Med.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'FrauncesD';src:url('assets/fonts/Fraunces-Disp.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Plex';src:url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Plex';src:url('assets/fonts/IBMPlexMono-Bold.ttf') format('truetype');font-weight:700;font-display:swap}

:root{
  --papel:#FBFAF6; --hoja:#FFFFFF; --oliva:#4A4E2C; --oliva-o:#3D4024; --oliva-t:#ECEDE3; --oliva-tt:#F5F5EE;
  --tinta:#1C1C16; --tinta2:#4D4C42; --gris:#8A887C; --gris2:#B5B2A6; --linea:#DFDCD0; --linea2:#ECE9DF;
  --rojo:#9B1C2E; --rojo-t:#F7E6E8; --ambar:#8A6A1F; --ambar-t:#F6F0DF;
  --r:4px; --r2:8px; --tap:44px; --top:60px; --panel-w:360px;
  --sombra:0 1px 2px rgba(28,28,22,.04),0 8px 24px rgba(28,28,22,.06);
  --sombra2:0 24px 64px rgba(28,28,22,.18);
  --u-EGO:#4A4E2C; --u-MYLO:#C0511E; --u-PAN:#7A5230;
  --u-EGO-t:#E9EADF; --u-MYLO-t:#F8E6DB; --u-PAN-t:#EFE5DA; --u-T-t:#E4E2DA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:'Fraunces',Georgia,serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.mono{font-family:'Plex',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.oculto{display:none!important}
:focus-visible{outline:2px solid var(--oliva);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- BOTONES ---------- */
.btn{height:var(--tap);padding:0 18px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--oliva);color:#fff}.btn-p:hover{background:var(--oliva-o)}
.btn-s{background:var(--hoja);border:1px solid var(--linea)}.btn-s:hover{border-color:var(--gris2)}
.btn-g{color:var(--oliva)}.btn-g:hover{background:var(--oliva-tt)}
.btn-peligro{background:var(--rojo);color:#fff}.btn-peligro:hover{background:#821626}
.btn[disabled]{opacity:.4;pointer-events:none}
.ico{width:var(--tap);height:var(--tap);border-radius:var(--r);display:inline-grid;place-items:center;flex:none;color:var(--tinta)}
.ico:hover{background:var(--oliva-tt)}
.ico svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- CABECERA ---------- */
.demo{background:var(--ambar-t);color:var(--ambar);text-align:center;padding:6px 12px;font-size:13px}
.demo button{margin-left:10px;color:var(--ambar);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
.top{position:sticky;top:0;z-index:30;background:rgba(251,250,246,.94);backdrop-filter:saturate(1.4) blur(10px);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1560px;margin:0 auto;height:var(--top);padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0}
.marca b{font-family:'FrauncesD','Fraunces',serif;font-size:30px;line-height:1;letter-spacing:-.01em;color:var(--oliva)}
.marca span{color:var(--gris);white-space:nowrap}
.top-der{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-width:0}
.vivo{display:flex;align-items:center;gap:7px;color:var(--gris);white-space:nowrap}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--gris2);flex:none}
.vivo.on i{background:var(--oliva);animation:pulso 2.4s infinite}
.vivo.off i{background:var(--ambar)}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(74,78,44,.45)}70%{box-shadow:0 0 0 8px rgba(74,78,44,0)}100%{box-shadow:0 0 0 0 rgba(74,78,44,0)}}
.yo{display:flex;align-items:center;gap:8px;height:var(--tap);padding:0 8px 0 4px;border-radius:999px;white-space:nowrap}
.yo:hover{background:var(--oliva-tt)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--oliva);color:#fff;display:grid;place-items:center;
  font-family:'Plex';font-size:12px;font-weight:700;flex:none}
.nuevo-m{display:none;background:var(--oliva);color:#fff;border-radius:50%}.nuevo-m:hover{background:var(--oliva-o)}
.red{background:var(--ambar-t);color:var(--ambar);font-size:13px;text-align:center;padding:5px 12px;border-top:1px solid #EDE3C8}
.seg{display:inline-flex;background:var(--oliva-t);border-radius:var(--r);padding:3px;gap:2px;max-width:100%}
.seg button{height:38px;padding:0 14px;border-radius:3px;font-size:14px;color:var(--tinta2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--hoja);color:var(--tinta);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.con-ind{position:relative;isolation:isolate}
.seg.con-ind .ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:3px;background:var(--hoja);pointer-events:none;z-index:-1;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(28,28,22,.06);transition:transform .34s cubic-bezier(.3,.9,.3,1),width .34s cubic-bezier(.3,.9,.3,1)}
.seg.con-ind button{transition:color .2s}
.seg.con-ind button.on{background:transparent;box-shadow:none}
.bd{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rojo);color:#fff;font-family:'Plex';font-size:10px;font-weight:700;
  display:inline-grid;place-items:center;line-height:1}

/* ---------- CUERPO ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:10px 20px 48px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.cab{display:flex;align-items:center;gap:8px;min-height:54px;margin-bottom:8px}
.titulo-mes{display:flex;align-items:center;gap:2px;min-width:0}
.titulo-mes h1{margin:0 6px;font-family:'FrauncesD','Fraunces',serif;font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.titulo-mes h1 small{font-family:'Fraunces';font-weight:400;color:var(--gris);font-size:.6em;margin-left:8px;letter-spacing:0}
.cab .acc{display:flex;align-items:center;gap:6px;margin-left:auto}
.filtro{height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--tinta);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.filtro svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.filtro .fm{width:10px;height:10px}
.filtro .ufm{color:#fff!important}
.filtro .fc{display:none}
.hoy-b{height:40px;padding:0 12px}
.hoy-i{display:none}
.buscador{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.buscador input{flex:1;min-width:0;height:46px;border:1px solid var(--oliva);border-radius:var(--r);background:var(--hoja);padding:0 14px;font-size:16px;
  box-shadow:0 0 0 3px rgba(74,78,44,.1);outline:0}

/* ---------- MES ---------- */
.mes-lay{display:grid;gap:16px;align-items:start}
.mes-lay.lado{grid-template-columns:minmax(0,1fr) var(--panel-w)}
.mes-lay.pila{grid-template-columns:minmax(0,1fr);gap:12px}
.cal{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sombra);
  display:flex;flex-direction:column;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--linea);background:var(--oliva-tt);flex:none}
.cal-dias div{padding:7px 10px;color:var(--gris)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(var(--filas,6),minmax(0,1fr));flex:1;min-height:0}
.dia{position:relative;border-right:1px solid var(--linea2);border-bottom:1px solid var(--linea2);padding:5px 6px 6px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0;transition:background .12s;outline-offset:-3px}
.dia:nth-child(7n){border-right:0}
.dia.ult{border-bottom:0}
.dia:hover{background:#FDFDF8}
.dia.fuera{background:#FAF9F4}.dia.fuera .num{color:var(--gris2)}
.dia.pasado .num{color:var(--gris)}
.dia.sel{background:var(--oliva-tt);box-shadow:inset 0 0 0 2px var(--oliva)}
.dia.bloq{background-image:repeating-linear-gradient(135deg,var(--b-t) 0 5px,transparent 5px 11px)}
.dt{display:flex;align-items:center;gap:6px;min-width:0;flex:none}
.num{font-size:14px;min-width:26px;height:26px;padding:0 4px;display:grid;place-items:center;border-radius:13px;flex:none}
.dia.hoy .num{background:var(--tinta);color:#fff;font-weight:600}
.dt .mas{margin-left:auto}
.mas{font-family:'Plex';font-size:10.5px;font-weight:700;color:var(--tinta2);flex:none;white-space:nowrap}
.bq{display:flex;align-items:center;gap:4px;font-family:'Plex';font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--b);
  font-weight:700;min-width:0;white-space:nowrap;overflow:hidden}
.bq svg{width:11px;height:11px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.bq span{overflow:hidden;text-overflow:ellipsis}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{font-size:12.5px;line-height:1.25;border-radius:3px;padding:2px 6px;display:flex;gap:5px;align-items:center;min-width:0;
  color:#fff;background:var(--u);cursor:pointer;border:1.5px solid var(--u);min-height:21px}
.ev .fm{flex:none;width:9px;height:9px}
.ev .h{font-family:'Plex';font-size:10.5px;opacity:.92;flex:none}
.ev .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.ev.st-Tentativo{background:var(--u-t);color:var(--u);border-style:dashed}
.ev.st-Cotizado,.ev.st-Prospecto{background:var(--hoja);color:var(--u);border-style:dotted}
.ev.st-Realizado{opacity:.55}
.ev.st-Cancelado{background:transparent;color:var(--gris);border-color:var(--linea);text-decoration:line-through}
.ev:hover{filter:brightness(1.08)}
/* celdas angostas (celular): número y figuras */
.cal.compacto .cal-dias div{padding:6px 0;text-align:center;font-size:10px}
.cal.compacto .dia{padding:4px 1px 3px;align-items:center;gap:4px}
.cal.compacto .num{font-size:14px;min-width:28px;height:28px;border-radius:14px}
.cal.compacto .dia.sel{box-shadow:none;background:var(--oliva-tt)}
.cal.compacto .dia.sel .num{box-shadow:0 0 0 2px var(--oliva)}
.cal.compacto .dia.hoy.sel .num{box-shadow:0 0 0 2px var(--oliva-tt),0 0 0 4px var(--oliva)}
.pts{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:3px;max-width:100%;padding:0 2px}
.pt{display:inline-flex}
.pt .fm{width:10px;height:10px}
.pt.st-Realizado{opacity:.5}
.pts .mas{font-size:9.5px;line-height:10px}
.bq-c{position:absolute;top:3px;right:3px;color:var(--b);display:inline-flex}
.bq-c svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.cal.compacto .leyenda{display:none}
.leyenda{display:flex;gap:6px 16px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--linea);color:var(--gris);flex:none}
.leyenda span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.leyenda .fm{width:11px;height:11px}
.leyenda .sep{width:1px;height:14px;background:var(--linea)}
.lg{width:22px;height:12px;border-radius:2px;border:1.5px solid var(--tinta);display:inline-block}
.lg.c{background:var(--tinta)}.lg.t{border-style:dashed;background:#ECEBE6}.lg.q{border-style:dotted}
.lg.b{border:0;background-image:repeating-linear-gradient(135deg,#CFCCC0 0 3px,transparent 3px 6px)}

/* ---------- PANEL DEL DÍA ---------- */
.panel{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);box-shadow:var(--sombra);display:flex;flex-direction:column;min-height:0}
.mes-lay.lado .panel{position:sticky;top:calc(var(--top) + 10px)}
.panel-h{padding:12px 6px 10px 16px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:2px;flex:none;touch-action:pan-y}
.panel-h .tt{flex:1;min-width:0}
.panel-h .mono{color:var(--gris)}
.panel-h h2{margin:2px 0 0;font-family:'FrauncesD','Fraunces',serif;font-size:27px;line-height:1.05;letter-spacing:-.01em}
.panel-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--linea2);flex:none}
.panel-acc .btn{padding:0 10px}
.cerrado{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--tinta);height:var(--tap);border-radius:var(--r);background:var(--u-T-t)}
.cerrado svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.panel-b{padding:10px 12px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overscroll-behavior:contain}
.mes-lay.pila .panel-b{overflow:visible}
.otros{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px dashed var(--gris2);border-radius:var(--r2);color:var(--tinta2);font-size:14px}
.otros .btn{height:34px;padding:0 10px;font-size:13px}
.bloqueo{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r2);border:1.5px solid var(--b);color:var(--b);
  background:repeating-linear-gradient(135deg,var(--b-t) 0 6px,var(--hoja) 6px 12px)}
.bloqueo>svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;margin-top:2px}
.bloqueo .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;color:var(--tinta)}
.bloqueo .tx b{color:var(--b);font-weight:600}
.bloqueo .tx .mono{color:var(--gris);font-size:10px}
.bloqueo .btn{height:36px;padding:0 10px;font-size:13px;color:var(--b);background:var(--hoja)}

/* ---------- TARJETA ---------- */
.card{display:block;width:100%;text-align:left;background:var(--hoja);border:1px solid var(--linea);border-left:3px solid var(--u);border-radius:var(--r2);
  padding:11px 13px 12px;transition:border-color .12s,box-shadow .12s,transform .12s;position:relative;cursor:pointer}
.card:hover{box-shadow:var(--sombra)}
.card:active{transform:scale(.988)}
.card.con-q{padding-right:42px}
.q-mas{position:absolute;top:4px;right:2px;width:36px;height:36px;color:var(--gris)}
.q-mas:hover{color:var(--tinta)}
.card.st-Cancelado{opacity:.6}
.card-top{display:flex;align-items:center;gap:6px 8px;margin-bottom:5px;flex-wrap:wrap}
.card-top .hr{color:var(--gris);margin-left:auto}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card p{margin:3px 0 0;color:#5c5b50;font-size:14px;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;color:var(--gris)}
.card .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.u{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:20px;padding:0 7px;flex:none;border-radius:3px;color:#fff;background:var(--u);
  font-family:'Plex';font-size:10px;font-weight:700;letter-spacing:.08em}
.u .fm{width:8px;height:8px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-family:'Plex';font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--linea);color:#55544a;background:var(--hoja);white-space:nowrap}
.pill.Confirmado{background:var(--oliva);border-color:var(--oliva);color:#fff}
.pill.Tentativo{border-style:dashed;border-color:var(--oliva);color:var(--oliva)}
.pill.Realizado{background:var(--oliva-t);border-color:var(--oliva-t);color:var(--oliva)}
.pill.Cancelado{color:var(--gris);text-decoration:line-through}
button.pill{cursor:pointer;height:28px;padding:0 10px}
button.pill::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-1px,-2px);margin-left:2px}
.flag{display:inline-flex;align-items:center;gap:4px;font-family:'Plex';font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:3px}
.flag.r{background:var(--rojo-t);color:var(--rojo)}.flag.a{background:var(--ambar-t);color:var(--ambar)}.flag.o{background:var(--oliva-t);color:var(--oliva)}

/* ---------- ABAJO DEL CALENDARIO ---------- */
.bajo{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.bajo-h{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.bajo-h>.mono{color:var(--gris)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--linea);background:var(--hoja);font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip .fm{width:10px;height:10px}
.chip.on{border-color:var(--tinta);background:var(--tinta);color:#fff}
.chip,.opciones button,.sugeridos button{transition:background .15s,border-color .15s,color .15s,transform .1s}
.chip:active,.opciones button:active,.sugeridos button:active,.ico:active,.seg button:active{transform:scale(.95)}
.chip.on .ufm{color:#fff!important}
.ley-m{display:none}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r2);overflow:hidden}
.kpi{background:var(--hoja);padding:14px 16px;min-width:0}
.kpi .mono{color:var(--gris)}
.kpi b{display:block;font-family:'FrauncesD','Fraunces';font-size:28px;line-height:1.15;margin-top:4px;letter-spacing:-.01em;white-space:nowrap}
.kpi em{font-style:normal;color:var(--gris);font-size:13px}
.kpi.alerta b{color:var(--rojo)}

/* ---------- AGENDA ---------- */
.ag-lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.ag-dia{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--linea)}
.ag-fecha{position:sticky;top:calc(var(--top) + env(safe-area-inset-top) + 10px);align-self:start}
.ag-fecha b{display:block;font-family:'FrauncesD','Fraunces';font-size:38px;line-height:1}
.ag-fecha span{color:var(--gris)}
.ag-fecha.hoy b{color:var(--oliva)}
.ag-evs{display:flex;flex-direction:column;gap:8px;min-width:0}
.ag-mes{margin:22px 0 2px;font-family:'FrauncesD','Fraunces';font-size:22px}
.atencion{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);padding:16px;position:sticky;top:calc(var(--top) + 12px);box-shadow:var(--sombra)}
.atencion h2{margin:0 0 4px;font-family:'FrauncesD','Fraunces';font-size:24px}
.at-item{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--linea2)}
.at-item:hover h4{color:var(--oliva)}
.at-item h4{margin:0 0 5px;font-size:15px;font-weight:600}
.at-item div{display:flex;gap:6px;flex-wrap:wrap}
.mas-btn{margin-top:10px;width:100%}

/* ---------- TABLERO ---------- */
.tab-lay{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{background:var(--oliva-tt);border:1px solid var(--linea);border-radius:var(--r2);padding:10px;min-height:300px;scroll-snap-align:start;
  transition:background .12s,border-color .12s;display:flex;flex-direction:column;gap:8px}
.col.drop{background:var(--oliva-t);border-color:var(--oliva)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 2px}
.col-h h3{margin:0;font-size:17px;font-weight:600}
.col-h span{color:var(--gris)}
.col-sum{color:var(--gris);padding:0 4px 4px}
.col .card[draggable=true]{cursor:grab}
.pista{color:var(--gris)}

/* ---------- BÚSQUEDA ---------- */
.busq{max-width:860px;display:flex;flex-direction:column;gap:8px}
.busq h3.sub{margin:14px 0 2px}
h3.sub,h4.sub{font-family:'Plex';font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--gris)}
h4.sub{margin:22px 0 10px}

/* ---------- ESTADOS ---------- */
.vacio{padding:36px 20px;text-align:center;color:var(--gris)}
.vacio h3{font-family:'FrauncesD','Fraunces';color:var(--tinta);font-size:22px;margin:0 0 6px}
.vacio .btn{margin-top:14px}
.carga{display:grid;place-items:center;min-height:70vh;min-height:70dvh;text-align:center}
.carga.sale{animation:sale .24s ease-in forwards}
.logo-c{position:relative;display:inline-block;font-family:'FrauncesD','Fraunces',serif;font-size:76px;line-height:1;letter-spacing:-.01em}
.logo-c span{display:block}
.logo-c .l0{color:var(--linea)}
.logo-c .l1{position:absolute;inset:0;color:var(--oliva);clip-path:inset(100% 0 0 0);
  animation:llena .75s cubic-bezier(.65,0,.35,1) .05s forwards,late 1.4s 1s ease-in-out infinite}
@keyframes llena{to{clip-path:inset(0 0 0 0)}}
@keyframes late{50%{opacity:.55}}
@keyframes sale{to{opacity:0;transform:scale(.97)}}

/* ---------- ACCESO Y ERRORES ---------- */
.acceso{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.acc-card{width:min(460px,100%);background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:36px 32px;box-shadow:var(--sombra2);position:relative}
.acc-card::before{content:"";position:absolute;inset:8px;border:1px solid var(--linea2);border-radius:8px;pointer-events:none}
.acc-card b.m{font-family:'FrauncesD','Fraunces';font-size:64px;line-height:.95;color:var(--oliva);display:block}
.acc-card .bar{height:5px;background:var(--oliva);margin:14px 0 22px;width:72px}
.acc-card h1{font-size:24px;margin:0 0 8px;font-weight:600}
.acc-card p{color:#5c5b50;margin:0 0 16px}
.acc-card ul{margin:0 0 18px;padding-left:18px;color:#5c5b50}
.acc-card li{margin-bottom:6px}
.err{background:var(--rojo-t);color:var(--rojo);padding:10px 12px;border-radius:var(--r);font-size:14px;margin-bottom:12px}
.det{color:var(--gris);font-size:12px;word-break:break-word}

/* ---------- CAJÓN DEL EVENTO ---------- */
.velo{position:fixed;inset:0;background:rgba(28,28,22,.32);z-index:50;opacity:0;transition:opacity .2s}
.velo.on{opacity:1}
.cajon{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--papel);z-index:51;display:flex;flex-direction:column;
  box-shadow:var(--sombra2);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.cajon.on{transform:none}
.asa{display:none;width:44px;height:5px;border-radius:3px;background:var(--gris2);margin:8px auto 6px}
.cj-h{padding:14px 20px 0;padding-top:max(14px,env(safe-area-inset-top));background:var(--hoja);border-bottom:1px solid var(--linea);flex:none}
.cj-bar{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-height:var(--tap)}
.cj-h h2{margin:2px 0 4px;font-family:'FrauncesD','Fraunces';font-size:32px;line-height:1.08;letter-spacing:-.01em;overflow-wrap:anywhere}
.cj-h h2 .ph{color:var(--gris2)}
.cj-sub{color:#5c5b50;display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:12px}
.dinero{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r2);overflow:hidden;margin-bottom:12px}
.dinero div{background:var(--hoja);padding:9px 12px;min-width:0}
.dinero b{display:block;font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dinero .mono{color:var(--gris)}
.progreso{position:relative;height:4px;background:var(--linea);border-radius:2px;margin:-4px 0 12px}
.progreso i{display:block;height:100%;background:var(--oliva);border-radius:2px;transition:width .4s}
.progreso em{position:absolute;top:-3px;width:2px;height:10px;background:var(--tinta);border-radius:1px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:44px;padding:0 12px;border-bottom:2px solid transparent;color:var(--gris);font-weight:600;white-space:nowrap;font-size:15px;flex:none}
.tabs button.on{color:var(--tinta);border-color:var(--oliva)}
.tabs button[disabled]{opacity:.35}
.tabs sup{font-family:'Plex';font-size:10px;margin-left:3px}
.cj-b{flex:1;overflow:auto;padding:18px 20px 30px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cj-f{padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--linea);background:var(--hoja);display:flex;gap:8px;align-items:center;flex:none}
.cj-f .esp{flex:1}
.cj-f .quien{color:var(--gris)}
.aviso{margin:0 0 14px;padding:10px 12px;border-radius:var(--r);background:var(--ambar-t);color:var(--ambar);display:flex;gap:10px;align-items:center;font-size:14px}
.aviso .btn{height:34px;padding:0 12px;font-size:13px;margin-left:auto}

/* formulario */
.sec{margin-bottom:22px}
.sec>.mono{display:block;color:var(--oliva);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--linea)}
.g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
.f label,.f .lb{display:block;color:var(--gris);margin-bottom:5px}
.f input,.f select,.f textarea,.fecha-v{width:100%;min-height:46px;border:1px solid var(--linea);border-radius:var(--r);background:var(--hoja);
  padding:10px 12px;font-size:16px;transition:border-color .12s,box-shadow .12s}
.f textarea{min-height:84px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--oliva);box-shadow:0 0 0 3px rgba(74,78,44,.12)}
.f .req{color:var(--rojo)}
.f input.mal{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(155,28,46,.12)}
.f-nombre input{font-size:18px;font-weight:600}
.fecha{position:relative}
.fecha-v{display:flex;align-items:center;justify-content:space-between}
.fecha-v svg{width:18px;height:18px;stroke:var(--gris);fill:none;stroke-width:1.6}
.fecha-v .ph{color:var(--gris2)}
.fecha input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;width:100%;height:100%}
.con-pre{position:relative}.con-pre span{position:absolute;left:12px;top:12px;color:var(--gris)}.con-pre input{padding-left:24px}
.opciones{display:flex;flex-wrap:wrap;gap:6px}
.opciones button{height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--linea);background:var(--hoja);font-size:14px;display:inline-flex;align-items:center;gap:7px}
.opciones button .fm{width:10px;height:10px}
.opciones button.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.opciones button.on .ufm{color:#fff!important}
.opciones.est button.on[data-v="Confirmado"]{background:var(--oliva);border-color:var(--oliva)}
.opciones.est button.on[data-v="Cancelado"]{background:var(--gris);border-color:var(--gris)}
.choque{margin-top:8px;font-size:13.5px;color:var(--ambar)}
.wa{color:var(--oliva);font-size:13px;text-decoration:none;display:inline-block;margin-top:6px}
.saldo-l{align-self:end;color:var(--gris);font-size:14px;padding-bottom:12px}
.saldo-l b{color:var(--tinta)}
.saldo-l .btn{height:32px;padding:0 10px;font-size:13px;margin-left:4px}
.f-bloq{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--linea);border-radius:var(--r2);background:var(--hoja);cursor:pointer;margin-top:12px}
.f-bloq input,.pend input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:1.5px solid var(--gris2);border-radius:var(--r);flex:none;margin:0;
  display:grid;place-items:center;background:var(--hoja);cursor:pointer}
.f-bloq input:checked,.pend input[type=checkbox]:checked{background:var(--oliva);border-color:var(--oliva)}
.f-bloq input:checked::after,.pend input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.f-bloq b{display:block;font-weight:600}.f-bloq span{color:var(--gris);font-size:14px}
.f-bloq input,.pend input[type=checkbox]{transition:background .15s,border-color .15s}
.mas-det{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border:1.5px dashed var(--gris2);border-radius:var(--r2);
  background:var(--hoja);transition:border-color .15s,background .15s;margin-bottom:8px}
.mas-det:hover{border-color:var(--oliva);background:var(--oliva-tt)}
.mas-det svg{width:22px;height:22px;stroke:var(--oliva);fill:none;stroke-width:1.8;flex:none}
.mas-det span{font-size:13.5px;color:var(--gris)}
.mas-det b{display:block;color:var(--tinta);font-weight:600;font-size:16px}
.alto{margin:0 0 16px;padding:10px 12px;border-radius:var(--r);background:var(--rojo-t);color:var(--rojo);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alto svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;margin-top:1px}

/* pagos */
.ant-nota{margin:-2px 0 16px;color:var(--tinta2);font-size:14px}
.pago-f{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);padding:14px}
.pago{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);margin-bottom:8px}
.pago .m{font-family:'FrauncesD','Fraunces';font-size:21px;white-space:nowrap;flex:none;min-width:96px}
.pago .info{flex:1;min-width:0}
.pago .info b{display:block;font-weight:600}
.pago .info span{color:var(--gris);display:block;overflow-wrap:anywhere}
.pago .ico{color:var(--gris)}

/* pendientes */
.pend{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--linea2)}
.pend input[type=checkbox]{margin-top:1px}
.pend .t{flex:1;padding-top:2px;overflow-wrap:anywhere}
.pend.ok .t{color:var(--gris);text-decoration:line-through}
.pend small{display:block;color:var(--gris);font-family:'Plex';font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;text-decoration:none}
.pend .ico{width:36px;height:36px;color:var(--gris)}
.agregar{display:flex;gap:8px;margin-top:12px}
.agregar input{flex:1;min-width:0;min-height:46px;border:1px solid var(--linea);border-radius:var(--r);background:var(--hoja);padding:0 12px;font-size:16px}
.sugeridos{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sugeridos button{min-height:34px;padding:4px 11px;border:1px dashed var(--gris2);border-radius:999px;font-size:13px;color:#5c5b50;text-align:left}
.sugeridos button:hover{border-color:var(--oliva);color:var(--oliva)}
.sugeridos .todos{border-style:solid;border-color:var(--oliva);color:var(--oliva);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sugeridos .todos svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.pend.recien input[type=checkbox]{animation:marca .34s cubic-bezier(.3,1.6,.5,1)}
.pend.recien input[type=checkbox]::after{animation:palomita .26s ease-out}
.pend.recien .t{animation:fade .3s}
@keyframes marca{from{transform:scale(.7)}}
@keyframes palomita{from{opacity:0;transform:rotate(45deg) translate(-1px,-1px) scale(.3)}}

/* bitácora */
.bit{position:relative;padding-left:22px}
.bit::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--linea)}
.bi{position:relative;padding:0 0 16px}
.bi::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--oliva);box-shadow:0 0 0 3px var(--papel)}
.bi.s::before{background:var(--gris2)}
.bi .q{color:var(--gris)}
.bi .tx{white-space:pre-wrap;margin-top:3px;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);padding:10px 12px;overflow-wrap:anywhere}
.bi.s .tx{background:transparent;border:0;padding:0;color:#5c5b50;font-size:14px}
.nota{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.nota textarea{min-height:78px;border:1px solid var(--linea);border-radius:var(--r);background:var(--hoja);padding:10px 12px;font-size:16px;resize:vertical}
.nota-pie{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nota-pie .mono{color:var(--gris)}

/* archivos */
.soltar{border:1.5px dashed var(--gris2);border-radius:var(--r2);padding:24px;text-align:center;color:var(--gris);background:var(--hoja);
  transition:border-color .12s,background .12s;cursor:pointer;display:block;margin-bottom:16px}
.soltar.on,.soltar:hover{border-color:var(--oliva);background:var(--oliva-tt);color:var(--oliva)}
.soltar b{display:block;color:var(--tinta);font-size:16px;margin-bottom:2px}
.subiendo{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px;border-radius:var(--r2);background:var(--oliva-tt);color:var(--oliva)}
.giro{width:18px;height:18px;border-radius:50%;border:2px solid var(--oliva-t);border-top-color:var(--oliva);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.arch{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);margin-bottom:8px}
.arch .ext{width:44px;height:52px;border-radius:3px;background:var(--oliva-t);color:var(--oliva);display:grid;place-items:center;font-family:'Plex';font-size:10px;
  font-weight:700;flex:none;overflow:hidden;background-size:cover;background-position:center}
.arch .info{flex:1;min-width:0}
.arch .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch .info span{color:var(--gris)}

/* papelera */
.pap{display:flex;align-items:center;gap:12px;padding:12px;background:var(--hoja);border:1px solid var(--linea);border-left:3px solid var(--u);border-radius:var(--r2);margin-bottom:8px;flex-wrap:wrap}
.pap .info{flex:1;min-width:200px}
.pap .info b{display:block;font-weight:600}
.pap .info span{color:var(--gris)}
.pap .acc{display:flex;gap:6px}
.pap .btn{height:38px;padding:0 12px;font-size:14px}

/* ---------- DIÁLOGO, TOAST, MENÚ ---------- */
.dlg-velo{position:fixed;inset:0;background:rgba(28,28,22,.4);z-index:80;display:grid;place-items:center;padding:20px;animation:apar .15s}
.dlg{width:min(440px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--hoja);border-radius:12px;padding:24px;box-shadow:var(--sombra2);animation:sube .2s cubic-bezier(.2,.8,.2,1)}
.dlg h3{margin:0 0 8px;font-family:'FrauncesD','Fraunces';font-size:24px;line-height:1.15}
.dlg p{margin:0 0 20px;color:#5c5b50;white-space:pre-line}
.dlg .acc{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.dlg .opciones{margin-bottom:14px}
.dlg .opciones button[disabled]{opacity:.35;text-decoration:line-through}
.dlg-velo.re,.dlg-velo.re .dlg{animation:none}
@keyframes apar{from{opacity:0}}@keyframes sube{from{opacity:0;transform:translateY(12px) scale(.98)}}
.toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--tinta);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:var(--sombra2);animation:sube .2s;display:flex;align-items:center;gap:12px}
.toast.e{background:var(--rojo);border-radius:14px}
.toast button{pointer-events:auto;color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
.menu{position:fixed;z-index:70;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r2);box-shadow:var(--sombra2);padding:6px;min-width:250px;max-width:calc(100vw - 20px);animation:apar .12s}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:var(--r);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--oliva-tt)}
.menu button.on{font-weight:600}
.menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu hr{border:0;border-top:1px solid var(--linea);margin:6px}
.menu .x{color:var(--rojo)}
.menu .pie{padding:6px 12px 4px;color:var(--gris)}
.menu .t{padding:6px 12px 2px;color:var(--gris)}
.atajos{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 6px}
.atajos kbd{font-family:'Plex';font-size:12px;border:1px solid var(--linea);border-bottom-width:2px;border-radius:4px;padding:2px 7px;background:var(--papel);text-align:center;align-self:start}

#imprimir{display:none}

/* ---------- MOVIMIENTO ---------- */
@keyframes fade{from{opacity:0}}
@keyframes entraDer{from{opacity:0;transform:translateX(38px)}}
@keyframes entraIzq{from{opacity:0;transform:translateX(-38px)}}
@keyframes entraArr{from{opacity:0;transform:translateY(10px)}}
.app-in{animation:fade .45s ease-out}
#vista.entra{animation:fade .24s ease-out}
.cal-grid.entra-der,.titulo-mes h1.entra-der,.panel-h .tt.entra-der{animation:entraDer .3s cubic-bezier(.2,.8,.2,1)}
.cal-grid.entra-izq,.titulo-mes h1.entra-izq,.panel-h .tt.entra-izq{animation:entraIzq .3s cubic-bezier(.2,.8,.2,1)}
.panel-h .tt.entra{animation:entraArr .26s cubic-bezier(.2,.8,.2,1)}
.lista-in>*{animation:entraArr .36s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),10) * 38ms)}
.aparece{animation:entraArr .42s .1s cubic-bezier(.2,.8,.2,1) both}
.dia.pop .num{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8)}}
.dia:active{background:var(--oliva-tt)}
/* cambios que llegan de otra persona: se iluminan un momento */
.card.flash,.at-item.flash{animation:flash 1.9s ease-out}
.ev.flash{animation:flashEv 1.9s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px rgba(74,78,44,.5)}100%{box-shadow:0 0 0 3px rgba(74,78,44,0)}}
@keyframes flashEv{0%,30%{box-shadow:0 0 0 2px var(--hoja),0 0 0 4px var(--oliva)}100%{box-shadow:0 0 0 2px transparent,0 0 0 4px transparent}}
/* mover un evento de día */
.mover{display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;margin:0 0 10px;border-radius:var(--r2);background:var(--tinta);color:#fff;

/* ---------------------------------------------------------------------
   ACCESO: el enlace personal trae la llave (#k=) y la conexión (&u= &p=).
   Todo se guarda en el equipo, así que no hay que editar index.html.
--------------------------------------------------------------------- */
function parsearEnlace(texto) {
  const t = String(texto || '').trim(), i = t.indexOf('#'), h = i >= 0 ? t.slice(i + 1) : t, q = {};
  h.split('&').forEach(par => { const j = par.indexOf('='); if (j > 0) { const k = par.slice(0, j); try { q[k] = decodeURIComponent(par.slice(j + 1)); } catch { q[k] = par.slice(j + 1); } } });
  if (!q.k && /^[A-Za-z0-9]{32,}$/.test(t)) q.k = t;
  return q;
}
function guardarEnlace(q) {
  if (!q.k || !/^[A-Za-z0-9]{16,}$/.test(q.k)) return false;
  ls.set('llave', q.k);
  if (q.u && q.p) {
    const u = q.u.includes('.') ? (/^https?:\/\//.test(q.u) ? q.u : 'https://' + q.u) : `https://${q.u}.supabase.co`;
    ls.set('conexion', { url: u.replace(/\/+$/, ''), key: q.p });
  }
  return true;
}
function leerEnlace() {
  if (!/(^#|&)k=/.test(location.hash)) return;
  guardarEnlace(parsearEnlace(location.hash));
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
}
/* CONFIG (en index.html) manda si se llenó; si no, la conexión que trajo el enlace */
function conexion() {
  if (CONFIG.url && CONFIG.key) return { url: CONFIG.url.replace(/\/+$/, ''), key: CONFIG.key };
  const c = ls.get('conexion', null); return c && c.url && c.key ? c : null;
}

/* ---------------------------------------------------------------------
   BACKEND REAL (Supabase) — todo lo de este calendario empieza con ev_
--------------------------------------------------------------------- */
function backendSupabase(cx, llave) {
  const sb = supabase.createClient(cx.url, cx.key, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    global: { headers: { 'x-llave': llave } }
  });
  const BUCKET = 'ev-archivos', ANIDADO = '*, ev_pendientes(*), ev_pagos(*)';
  let canal = null, carpeta = '';
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  // Supabase entrega máximo 1000 filas por consulta: se piden por páginas
  const todo = async hacer => { const out = []; for (let i = 0; ; i += 1000) { const d = ok(await hacer().range(i, i + 999)); out.push(...d); if (d.length < 1000) return out; } };
  const separar = filas => {
    const pe = [], pa = [];
    filas.forEach(e => { pe.push(...(e.ev_pendientes || [])); pa.push(...(e.ev_pagos || [])); delete e.ev_pendientes; delete e.ev_pagos; });
    return { ev: filas, pe, pa };
  };
  const rango = (q, desde, hasta) => { if (desde) q = q.gte('fecha', desde); if (hasta) q = q.lt('fecha', hasta); return q; };
  // Si el módulo de archivos de Supabase no recibe la llave, se activa solo el plan B (la carpeta secreta) y se reintenta
  let planB = false;
  const esPermiso = e => /row-level security|row level security|security policy|unauthorized|\b403\b/i.test(`${e && (e.message || e.error || '')} ${e && (e.statusCode || e.status || '')}`);
  const archivo = async fn => {
    try { return await fn(); }
    catch (e) { if (planB || !esPermiso(e)) throw e; planB = true; ok(await sb.rpc('ev_archivos_sin_llave')); return await fn(); }
  };
  return {
    demo: false,
    async quienSoy() { const r = ok(await sb.rpc('ev_quien_soy')); if (r) carpeta = r.carpeta || ''; return r; },
    async cargar(desde, hasta) {
      const [filas, bl] = await Promise.all([
        todo(() => rango(sb.from('ev_eventos').select(ANIDADO).is('eliminado_at', null), desde, hasta).order('fecha').order('id')),
        todo(() => rango(sb.from('ev_bloqueos').select('*'), desde, hasta).order('fecha').order('id'))
      ]);
      return { ...separar(filas), bl };
    },
    async evento(id) {
      const r = ok(await sb.from('ev_eventos').select(ANIDADO).eq('id', id).is('eliminado_at', null).maybeSingle());
      if (!r) return null; const s = separar([r]); return { ev: s.ev[0], pe: s.pe, pa: s.pa };
    },
    async bloqueos(desde) { return todo(() => rango(sb.from('ev_bloqueos').select('*'), desde).order('fecha').order('id')); },
    async papelera() {
      return ok(await sb.from('ev_eventos').select('id,unidad,nombre,fecha,estatus,cliente,empresa,total,eliminado_at,eliminado_por')
        .not('eliminado_at', 'is', null).order('eliminado_at', { ascending: false }).limit(300));
    },
    async crear(ev) { return ok(await sb.from('ev_eventos').insert(ev).select().single()); },
    async guardar(id, cambios, version) {
      const r = ok(await sb.from('ev_eventos').update(cambios).eq('id', id).eq('updated_at', version).select());
      return r.length ? r[0] : { conflicto: true };
    },
    async aPapelera(id) { return ok(await sb.from('ev_eventos').update({ eliminado_at: new Date().toISOString() }).eq('id', id).select().single()); },
    async restaurar(id) { return ok(await sb.from('ev_eventos').update({ eliminado_at: null }).eq('id', id).select().single()); },
    async purgar(id) {
      const fs = ok(await sb.from('ev_archivos').select('ruta').eq('evento_id', id));
      if (fs.length) await archivo(async () => { const { error } = await sb.storage.from(BUCKET).remove(fs.map(f => f.ruta)); if (error) throw error; }).catch(e => console.warn(e));
      ok(await sb.from('ev_eventos').delete().eq('id', id).not('eliminado_at', 'is', null));
    },
    async bloquear(b) { return ok(await sb.from('ev_bloqueos').insert(b).select().single()); },
    async desbloquear(id) { ok(await sb.from('ev_bloqueos').delete().eq('id', id)); },
    async addPend(evento_id, texto, orden) { return ok(await sb.from('ev_pendientes').insert({ evento_id, texto, orden }).select().single()); },
    async addPends(evento_id, textos, orden0) {
      const r = ok(await sb.from('ev_pendientes').insert(textos.map((texto, i) => ({ evento_id, texto, orden: orden0 + i }))).select());
      return r.sort((a, b) => a.orden - b.orden);
    },
    async marcarPend(id, hecho) { return ok(await sb.from('ev_pendientes').update({ hecho }).eq('id', id).select().single()); },
    async borrarPend(id) { ok(await sb.from('ev_pendientes').delete().eq('id', id)); },
    async bitacora(id) { return ok(await sb.from('ev_bitacora').select('*').eq('evento_id', id).order('created_at', { ascending: false }).limit(500)); },
    async nota(evento_id, texto) { ok(await sb.from('ev_bitacora').insert({ evento_id, texto })); },
    async archivos(id) { return ok(await sb.from('ev_archivos').select('*').eq('evento_id', id).order('created_at', { ascending: false })); },
    async subir(evento_id, file) {
      if (!carpeta) throw new Error('Falta la carpeta de archivos. Quien administra el calendario debe correr otra vez esquema.sql en Supabase.');
      const limpio = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
      const ruta = `${carpeta}/${evento_id}/${Date.now()}_${limpio}`;
      await archivo(async () => ok(await sb.storage.from(BUCKET).upload(ruta, file, { contentType: file.type || 'application/octet-stream', upsert: false })));
      try { return ok(await sb.from('ev_archivos').insert({ evento_id, nombre: file.name, ruta, tamano: file.size, tipo_mime: file.type || null }).select().single()); }
      catch (e) { await sb.storage.from(BUCKET).remove([ruta]); throw e; }
    },
    async urlArchivo(ruta) { return archivo(async () => ok(await sb.storage.from(BUCKET).createSignedUrl(ruta, 600)).signedUrl); },
    async urlsArchivos(rutas) {
      if (!rutas.length) return {};
      const r = await archivo(async () => ok(await sb.storage.from(BUCKET).createSignedUrls(rutas, 600))); const m = {};
      r.forEach(x => { if (x.signedUrl && !x.error) m[x.path] = x.signedUrl; }); return m;
    },
    async borrarArchivo(a) {
      await archivo(async () => { const { error } = await sb.storage.from(BUCKET).remove([a.ruta]); if (error) throw error; }).catch(e => console.warn(e));
      ok(await sb.from('ev_archivos').delete().eq('id', a.id));
    },
    async pagar(p) { return ok(await sb.from('ev_pagos').insert(p).select().single()); },
    async borrarPago(id) { ok(await sb.from('ev_pagos').delete().eq('id', id)); },
    async respaldo() {
      const t = ['ev_eventos', 'ev_pendientes', 'ev_pagos', 'ev_bloqueos', 'ev_bitacora', 'ev_archivos'];
      const [eventos, pendientes, pagos, bloqueos, bitacora, archivos] = await Promise.all(t.map(n => todo(() => sb.from(n).select('*').order('created_at').order('id'))));
      return { eventos, pendientes, pagos, bloqueos, bitacora, archivos };
    },
    vivo(nombre, alCambio, alEstado) {
      canal = sb.channel(nombre, { config: { broadcast: { self: false } } })
        .on('broadcast', { event: 'cambio' }, p => alCambio(p.payload || {}))
        .subscribe(st => alEstado(st === 'SUBSCRIBED' ? 'on' : (st === 'CLOSED' || st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') ? 'off' : 'wait'));
    },
    avisar(payload) { if (canal) canal.send({ type: 'broadcast', event: 'cambio', payload }).catch(() => {}); }
  };
}

/* ---------------------------------------------------------------------
   BACKEND DE DEMOSTRACIÓN — sin Supabase. Sigue las mismas reglas que la
   base de datos (días bloqueados, uso exclusivo, pagos, papelera) pero
   nada se guarda: al recargar la página vuelve como estaba.
--------------------------------------------------------------------- */
function backendDemo() {
  const yo = 'Luis';
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
  const ahora = () => new Date().toISOString();
  const clon = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  const espera = (v, ms = 70) => new Promise(r => setTimeout(() => r(clon(v)), ms));
  const D = datosDemo(uid), { ev, pe, pa, bl, bi, ar } = D;
  const nota = (evento_id, texto, sistema = true) => bi.push({ id: uid(), evento_id, autor: yo, texto, sistema, created_at: ahora() });
  const revisar = (n, v) => {
    if (n.estatus === 'Cancelado' || n.eliminado_at) return;
    if (v && n.fecha === v.fecha && n.unidad === v.unidad && v.estatus !== 'Cancelado' && !v.eliminado_at) return;
    const b = bl.find(x => x.fecha === n.fecha && (!x.unidad || x.unidad === n.unidad) && x.evento_id !== n.id);
    if (b) throw new Error('DIA_BLOQUEADO: ' + b.motivo);
  };
  const sincBloqueo = e => {
    const i = bl.findIndex(x => x.evento_id === e.id);
    if (e.exclusivo && e.estatus !== 'Cancelado' && !e.eliminado_at) {
      const b = { fecha: e.fecha, unidad: e.unidad, motivo: e.nombre + ' · uso exclusivo' };
      if (i >= 0) Object.assign(bl[i], b); else bl.push({ id: uid(), ...b, evento_id: e.id, creado_por: yo, created_at: ahora() });
    } else if (i >= 0) bl.splice(i, 1);
  };
  const recalcular = id => { const e = ev.find(x => x.id === id); if (e) { e.pagado = pa.filter(p => p.evento_id === id).reduce((s, p) => s + Number(p.monto), 0); e.updated_at = ahora(); } };
  const cambiosBit = (v, n) => {
    const c = [], txt = x => x ?? null, din = x => x === null || x === undefined || x === '' ? '—' : dinero(x);
    if (v.eliminado_at && !n.eliminado_at) c.push('Sacó el evento de la papelera');
    if (n.nombre !== v.nombre) c.push(`Nombre: «${v.nombre}» → «${n.nombre}»`);
    if (n.estatus !== v.estatus) c.push(`Estatus: ${v.estatus} → ${n.estatus}`);
    if (n.unidad !== v.unidad) c.push(`Unidad: ${v.unidad} → ${n.unidad}`);
    if (n.fecha !== v.fecha) c.push(`Fecha: ${fFecha(v.fecha)} → ${fFecha(n.fecha)}`);
    const hr = e => (fHora(e.hora_inicio) || '—') + (e.hora_fin ? '–' + fHora(e.hora_fin) : '');
    if (hr(n) !== hr(v)) c.push(`Horario: ${hr(v)} → ${hr(n)}`);
    if (txt(n.pax) !== txt(v.pax)) c.push(`Personas: ${v.pax ?? '—'} → ${n.pax ?? '—'}`);
    if (Number(n.total ?? -1) !== Number(v.total ?? -1)) c.push(`Total: ${din(v.total)} → ${din(n.total)}`);
    if (Number(n.anticipo ?? -1) !== Number(v.anticipo ?? -1)) c.push(`Anticipo: ${din(v.anticipo)} → ${din(n.anticipo)}`);
    if (txt(n.limite_anticipo) !== txt(v.limite_anticipo)) c.push(`Anticipo a más tardar: ${fFecha(v.limite_anticipo) || '—'} → ${fFecha(n.limite_anticipo) || '—'}`);
    if (txt(n.responsable) !== txt(v.responsable)) c.push(`Responsable: ${v.responsable || '—'} → ${n.responsable || '—'}`);
    if (!!n.exclusivo !== !!v.exclusivo) c.push(n.exclusivo ? 'Activó uso exclusivo (bloquea el día)' : 'Quitó el uso exclusivo (desbloquea el día)');
    return c;
  };
  const conHora = x => { ['hora_inicio', 'hora_fin'].forEach(k => { if (x[k] && x[k].length === 5) x[k] += ':00'; }); return x; };
  const borrarDe = (t, f) => { for (let j = t.length - 1; j >= 0; j--) if (f(t[j])) t.splice(j, 1); };
  return {
    demo: true,
    quienSoy: () => espera({ nombre: yo, canal: 'demo', carpeta: 'demo' }, 350),
    cargar: () => espera({ ev: ev.filter(e => !e.eliminado_at), pe, pa, bl }, 250),
    evento(id) { const e = ev.find(x => x.id === id && !x.eliminado_at); return espera(e ? { ev: e, pe: pe.filter(p => p.evento_id === id), pa: pa.filter(p => p.evento_id === id) } : null); },
    bloqueos: () => espera(bl),
    papelera: () => espera(ev.filter(e => e.eliminado_at).sort((a, b) => b.eliminado_at.localeCompare(a.eliminado_at)), 200),
    async crear(x) {
      const e = conHora({ ...x, id: uid(), pagado: 0, creado_por: yo, actualizado_por: yo, created_at: ahora(), updated_at: ahora(), eliminado_at: null, eliminado_por: null });
      revisar(e, null); ev.push(e); sincBloqueo(e); nota(e.id, 'Creó el evento' + (e.exclusivo ? ' con uso exclusivo (bloquea el día)' : ''));
      return espera(e, 300);
    },
    async guardar(id, c, version) {
      const v = ev.find(x => x.id === id);
      if (!v || v.updated_at !== version) return espera({ conflicto: true });
      const n = conHora({ ...v, ...c }); revisar(n, v);
      const t = cambiosBit(v, n);
      Object.assign(v, n, { updated_at: ahora(), actualizado_por: yo }); sincBloqueo(v);
      if (t.length) nota(id, t.join('\n'));
      return espera(v, 300);
    },
    async aPapelera(id) { const v = ev.find(x => x.id === id); Object.assign(v, { eliminado_at: ahora(), eliminado_por: yo, updated_at: ahora() }); sincBloqueo(v); nota(id, 'Mandó el evento a la papelera'); return espera(v); },
    async restaurar(id) { const v = ev.find(x => x.id === id); const n = { ...v, eliminado_at: null }; revisar(n, v); nota(id, cambiosBit(v, n).join('\n')); Object.assign(v, { eliminado_at: null, eliminado_por: null, updated_at: ahora(), actualizado_por: yo }); sincBloqueo(v); return espera(v); },
    async purgar(id) { borrarDe(ev, x => x.id === id); [pe, pa, bl, bi, ar].forEach(t => borrarDe(t, x => x.evento_id === id)); return espera(); },
    async bloquear(b) { const x = { id: uid(), fecha: b.fecha, unidad: b.unidad || null, motivo: b.motivo.trim(), evento_id: null, creado_por: yo, created_at: ahora() }; bl.push(x); return espera(x); },
    async desbloquear(id) {
      const i = bl.findIndex(x => x.id === id); if (i < 0) return espera();
      const [b] = bl.splice(i, 1);
      if (b.evento_id) { const e = ev.find(x => x.id === b.evento_id); if (e && e.exclusivo) { e.exclusivo = false; e.updated_at = ahora(); nota(e.id, `Desbloqueó el ${fFecha(b.fecha)} (quitó el uso exclusivo)`); } }
      return espera();
    },
    async addPend(evento_id, texto, orden) { const p = { id: uid(), evento_id, texto: texto.trim(), hecho: false, orden, creado_por: yo, hecho_por: null, hecho_at: null, created_at: ahora() }; pe.push(p); return espera(p); },
    async addPends(evento_id, textos, orden0) {
      const l = textos.map((t, i) => ({ id: uid(), evento_id, texto: t.trim(), hecho: false, orden: orden0 + i, creado_por: yo, hecho_por: null, hecho_at: null, created_at: ahora() }));
      pe.push(...l); return espera(l, 200);
    },
    async marcarPend(id, hecho) { const p = pe.find(x => x.id === id); Object.assign(p, { hecho, hecho_por: hecho ? yo : null, hecho_at: hecho ? ahora() : null }); return espera(p); },
    async borrarPend(id) { borrarDe(pe, x => x.id === id); return espera(); },
    bitacora: id => espera(bi.filter(b => b.evento_id === id).sort((a, b) => b.created_at.localeCompare(a.created_at)), 150),
    async nota(evento_id, texto) { nota(evento_id, texto.trim(), false); return espera(); },
    archivos: id => espera(ar.filter(a => a.evento_id === id).sort((a, b) => b.created_at.localeCompare(a.created_at)), 150),
    async subir(evento_id, file) {
      await espera(null, 400 + Math.min(1200, file.size / 3000));
      const a = { id: uid(), evento_id, nombre: file.name, ruta: URL.createObjectURL(file), tamano: file.size, tipo_mime: file.type, subido_por: yo, created_at: ahora() };
      ar.push(a); nota(evento_id, 'Subió el archivo ' + file.name); return clon(a);
    },
    async urlArchivo(ruta) { return ruta && ruta.startsWith('blob:') ? ruta : null; },
    async urlsArchivos(rutas) { const m = {}; rutas.forEach(r => { if (r && r.startsWith('blob:')) m[r] = r; }); return m; },
    async borrarArchivo(a) { borrarDe(ar, x => x.id === a.id); nota(a.evento_id, 'Eliminó el archivo ' + a.nombre); return espera(); },
    async pagar(p) {
      const x = { id: uid(), ...p, registrado_por: yo, created_at: ahora() }; pa.push(x); recalcular(p.evento_id);
      nota(p.evento_id, `Registró pago de ${dinero(p.monto)} · ${p.forma} · ${fFecha(p.fecha)}${p.nota ? ' · ' + p.nota : ''}`); return espera(x, 250);
    },
    async borrarPago(id) {
      const i = pa.findIndex(x => x.id === id); if (i < 0) return espera();
      const [p] = pa.splice(i, 1); recalcular(p.evento_id); nota(p.evento_id, `Borró el pago de ${dinero(p.monto)} · ${p.forma} · ${fFecha(p.fecha)}`); return espera();
    },
    respaldo: () => espera({ eventos: ev, pendientes: pe, pagos: pa, bloqueos: bl, bitacora: bi, archivos: ar }),
    vivo(n, alCambio, alEstado) { setTimeout(() => alEstado('on'), 500); },
    avisar() {}
  };
}

}

function aplicarDatos(d) {

  const idsViejos = new Set(S.eventos.filter(viejo).map(e => e.id));
  S.eventos = ordenarEv([...S.eventos.filter(viejo), ...d.ev]);
  S.pend = [...S.pend.filter(p => idsViejos.has(p.evento_id)), ...d.pe];
  S.pagos = [...S.pagos.filter(p => idsViejos.has(p.evento_id)), ...d.pa];
  S.bloq = [...S.bloq.filter(viejo), ...d.bl];
}
async function recargar(silencioso) {
  try {
    const d = await S.api.cargar(S.api.demo ? null : S.desde);
    aplicarDatos(d); S.ultimaCarga = Date.now(); marcarRed(true);
    if (S.cargado) { renderVista(); refrescarCajonRemoto(); }
  } catch (e) { marcarRed(false); if (!silencioso) throw e; console.warn(e); }
}
async function recargarEvento(id) {
  const r = await S.api.evento(id);
  S.eventos = S.eventos.filter(e => e.id !== id); S.pend = S.pend.filter(p => p.evento_id !== id); S.pagos = S.pagos.filter(p => p.evento_id !== id);
  if (r && r.ev && (S.historial || r.ev.fecha >= S.desde)) { S.eventos = ordenarEv([...S.eventos, r.ev]); S.pend.push(...r.pe); S.pagos.push(...r.pa); }
}

  const l = await S.api.bloqueos(S.api.demo ? null : S.desde);

async function cargarHistorial() {
  if (S.historial || S.cargandoHist) return; S.cargandoHist = true; renderVista();
  try {
    const d = await S.api.cargar(null, S.desde);
    S.eventos = ordenarEv([...d.ev, ...S.eventos.filter(e => e.fecha >= S.desde)]);
    S.pend = [...d.pe, ...S.pend]; S.pagos = [...d.pa, ...S.pagos]; S.bloq = [...d.bl, ...S.bloq.filter(b => b.fecha >= S.desde)];

  clearTimeout(cola.t);

    const { ids, por, todo, bl } = cola; cola.ids = new Set(); cola.por = new Set(); cola.todo = false; cola.bl = false;

      if (bl || ids.size) await recargarBloqueos();

      /* un aviso por evento cada 20 s: palomear varios pendientes seguidos no llena la pantalla de avisos */
      const nuevos = [...ids].filter(id => !(Date.now() - (yaAvisado[id] || 0) < 20e3));
      if (por.size && nuevos.length) {

function alertas(e) {

    const d = e.target.closest('.dia'); if (!d || !S.arrastre) return; e.preventDefault();
    const ev = S.eventos.find(x => x.id === S.arrastre);
    const malo = ev && ev.estatus !== 'Cancelado' && bloqueoPara(d.dataset.v, ev.unidad, ev.id);
    limpia(d); d.classList.toggle('drop-ok', !malo); d.classList.toggle('drop-no', !!malo);

/* tarjeta de evento: la etiqueta de estatus cambia el estatus; los tres puntos dan acciones rápidas */

function listaAgenda(entra) {

    : r === 'mes' ? evs.filter(e => e.fecha.slice(0, 7) === h.slice(0, 7))

  const g = []; l.forEach(e => { const u = g[g.length - 1]; if (u && u.f === e.fecha) u.l.push(e); else g.push({ f: e.fecha, l: [e] }); });
  let mesAnt = '', i = 0;
  const grupos = g.map(x => {
    const d = deISO(x.f), m = x.f.slice(0, 7), cab = m !== mesAnt ? `<h2 class="ag-mes">${MESES[d.getMonth()]} ${d.getFullYear()}</h2>` : ''; mesAnt = m;
    return `${cab}<div class="ag-dia" style="--i:${Math.min(i++, 12)}"><div class="ag-fecha ${x.f === h ? 'hoy' : ''}"><b>${d.getDate()}</b><span class="mono">${DIAS3[d.getDay()]}${x.f === h ? ' · hoy' : ''}</span></div>
      <div class="ag-evs">${x.l.map(e => tarjeta(e)).join('')}</div></div>`;

  return `<div class="${entra ? 'lista-in' : ''}">${grupos || `<div class="vacio"><h3>Nada por aquí</h3>No hay eventos en este rango${S.unidad !== 'TODAS' ? ' para ' + UNOM[S.unidad] : ''}.</div>`}</div>
    ${faltaHist ? `<div class="vacio" style="padding:18px">${S.cargandoHist ? 'Cargando eventos anteriores…' : `Se muestran desde ${fFecha(S.desde)}. <button class="btn btn-s" data-a="historial">Cargar los anteriores</button>`}</div>` : ''}`;
}
function cambiarRango(v) {
  S.rango = v; if ((v === 'pasados' || v === 'todos') && !S.historial) cargarHistorial();
  const seg = $('#segRango'), lista = $('#agLista');
  if (!seg || !lista) return renderVista();
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));

function vistaTablero(entra) {

function activarArrastre() {
  $$('.col').forEach(col => {
    col.addEventListener('dragover', e => { if (!S.arrastre) return; e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('drop'); cambiarEstatus(e.dataTransfer.getData('text/plain') || S.arrastre, col.dataset.col); });

async function cambiarEstatus(id, nuevo) {
  const ev = S.eventos.find(x => x.id === id); if (!ev || ev.estatus === nuevo) return;
  const extra = nuevo === 'Cancelado' && ev.exclusivo ? '\n\nTambién se libera el día que tenía bloqueado.' : '';
  if (!await confirmar(`¿Cambiar a ${nuevo}?`, `«${ev.nombre}» pasa de ${ev.estatus} a ${nuevo}. Queda registrado en la bitácora.${extra}`, 'Cambiar estatus')) return;
  try {
    const r = await S.api.guardar(id, { estatus: nuevo }, ev.updated_at);
    if (r.conflicto) { await recargarEvento(id); renderVista(); return toast('Alguien acaba de cambiar este evento. Revisa y vuelve a intentar.', 1); }
    S.eventos = ordenarEv(S.eventos.map(x => x.id === id ? r : x));
    if (ev.exclusivo) await recargarBloqueos();
    avisar(id); toast('Estatus actualizado: ' + nuevo); renderVista(); resaltar([id]);
  } catch (er) { toast('No se cambió. ' + msgError(er), 1); }
}

/* ---------- MOVER UN EVENTO DE DÍA ---------- */
/* devuelve true si se movió. Con mouse: arrastrar. En celular: "Mover a otro día" y tocar el día. */
async function moverEvento(id, fecha, sinPreguntar) {
  const e = S.eventos.find(x => x.id === id); if (!e) return false;
  if (e.fecha === fecha) { if (S.moviendo) toast('Ya está en ese día: elige otro', 1); return false; }
  const b = e.estatus !== 'Cancelado' && bloqueoPara(fecha, e.unidad, e.id);
  if (b) { toast(`El ${fFecha(fecha)} está bloqueado para ${UNOM[e.unidad]}: ${b.motivo}`, 1); return false; }
  if (!sinPreguntar) {
    const ch = choques({ ...e, hora_inicio: fHora(e.hora_inicio), hora_fin: fHora(e.hora_fin), fecha });
    const txt = `«${e.nombre}» pasa del ${fDiaLargo(e.fecha)} al ${fDiaLargo(fecha)}.`
      + (ch.length ? `\n\nOjo: a esa hora ${UNOM[e.unidad]} ya tiene ${ch.map(x => '«' + x.nombre + '»').join(', ')}.` : '')
      + (e.exclusivo ? '\n\nSu bloqueo de uso exclusivo se mueve con él.' : '');
    if (!await confirmar('¿Mover el evento?', txt, 'Mover evento')) return false;
  }
  const antes = e.fecha;
  try {
    const r = await S.api.guardar(id, { fecha }, e.updated_at);
    if (r.conflicto) { await recargarEvento(id); renderVista(); toast('Alguien acaba de cambiar este evento. Intenta otra vez.', 1); return false; }
    S.eventos = ordenarEv(S.eventos.map(x => x.id === id ? r : x));
    if (e.exclusivo) await recargarBloqueos();
    avisar(id);
    if (S.moviendo === id) { S.moviendo = null; soltarCapa('mover'); }
    const n = fecha > S.dia ? 1 : -1; S.dia = fecha;
    if (S.vista === 'mes' && !S.buscando && mesDe(fecha) !== S.mes) { S.mes = mesDe(fecha); renderVista(n); } else renderVista();
    resaltar([id]);
    toast('Movido al ' + fDiaLargo(fecha), 0, ['Deshacer', () => moverEvento(id, antes, true)]);
    return true;
  } catch (er) { toast('No se movió. ' + msgError(er), 1); return false; }
}
async function empezarMover(id) {
  const e = S.eventos.find(x => x.id === id); if (!e) return;
  if (S.cj && S.cj.sucio && !await confirmar('¿Descartar cambios?', 'Tienes cambios sin guardar en este evento.', 'Descartar cambios', true)) return;
  const fn = () => { S.moviendo = null; renderVista(); };
  const top = capas[capas.length - 1];
  /* el modo mover toma el lugar del cajón o de la búsqueda (misma entrada del botón atrás) */
  if (top && (top.n === 'evento' || top.n === 'buscar')) { if (top.n === 'evento') ocultarCajon(); capas[capas.length - 1] = { n: 'mover', fn }; }
  else pushCapa('mover', fn);
  S.buscando = false; S.q = '';
  if (S.vista !== 'mes') { S.vista = 'mes'; ls.set('vista', 'mes'); S.animVista = true; }
  S.moviendo = id; S.mes = mesDe(e.fecha); S.dia = e.fecha;
  renderVista(); scrollTo({ top: 0, behavior: movimiento() ? 'smooth' : 'auto' });
}

/* ---------- BÚSQUEDA (en todas las fechas) ---------- */
function vistaBusqueda() {
  const q = sinAcentos(S.q.trim()), h = hoyISO();
  const l = S.eventos.filter(e => coincide(e, q));
  const prox = l.filter(e => e.fecha >= h), pas = l.filter(e => e.fecha < h).reverse();
  return `<div class="busq"><div class="mono" style="color:var(--gris)">${plural(l.length, 'resultado')}${S.cargandoHist ? ' · buscando también en eventos anteriores…' : ''}</div>
    ${prox.length ? `<h3 class="sub">Próximos</h3>${prox.map(e => tarjeta(e, { fecha: true })).join('')}` : ''}
    ${pas.length ? `<h3 class="sub">Pasados</h3>${pas.slice(0, 60).map(e => tarjeta(e, { fecha: true })).join('')}` : ''}
    ${!l.length ? `<div class="vacio"><h3>Sin resultados</h3>Ningún evento coincide con «${esc(S.q.trim())}». Prueba con el nombre del cliente, la empresa o el teléfono.</div>` : ''}</div>`;
}
function abrirBusqueda() {
  if (S.buscando) { $('#q')?.focus(); return; }
  const top = capas[capas.length - 1];
  if (S.moviendo && top && top.n === 'mover') { S.moviendo = null; capas[capas.length - 1] = { n: 'buscar', fn: cerrarBusqueda }; }
  else pushCapa('buscar', cerrarBusqueda);

}
function cerrarBusqueda() { S.buscando = false; S.q = ''; renderVista(); }

/* ---------- ABAJO: FILTRO POR UNIDAD Y NÚMEROS ---------- */
function pintarBajo(mostrar, animar) {
  const b = $('#bajo'); if (!b) return;
  if (!mostrar) { b.innerHTML = ''; return; }
  b.innerHTML = `<div class="bajo-h"><span class="mono">Unidad</span><div class="chips">
      ${[['TODAS', 'Todas'], ['EGO', 'EGO'], ['MYLO', 'Mylo'], ['PAN', 'Panadería']].map(([k, t]) =>
        `<button class="chip ${S.unidad === k ? 'on' : ''}" data-a="unidad" data-v="${k}" aria-pressed="${S.unidad === k}">${k !== 'TODAS' ? uForma(k) : ''}${t}</button>`).join('')}
      <button class="chip ${S.verCancel ? 'on' : ''}" data-a="cancel" aria-pressed="${S.verCancel}">Cancelados</button></div></div>
    ${S.vista === 'mes' ? `<div class="ley-m mono">${leyendaHTML()}</div>` : ''}
    <section class="kpis">${kpisHTML()}</section>`;
  contarKpis(animar);
}
function kpisHTML() {
  let lista, et;
  if (S.vista === 'mes') { lista = filtrados().filter(e => e.fecha.slice(0, 7) === S.mes.slice(0, 7)); et = MESES[deISO(S.mes).getMonth()].toLowerCase(); }
  else { const h = hoyISO(); lista = filtrados().filter(e => e.fecha >= h); et = 'próximos'; }
  const vivos = lista.filter(e => e.estatus !== 'Cancelado');
  const conf = vivos.filter(e => ['Confirmado', 'Realizado'].includes(e.estatus));
  const pax = vivos.filter(e => ['Confirmado', 'Tentativo', 'Realizado'].includes(e.estatus)).reduce((s, e) => s + (e.pax || 0), 0);
  const venta = conf.reduce((s, e) => s + Number(e.total || 0), 0);
  const cobrar = conf.reduce((s, e) => s + saldo(e), 0);
  const embudo = vivos.filter(e => ABIERTOS.includes(e.estatus)).reduce((s, e) => s + Number(e.total || 0), 0);
  const n = (k, v, f) => `<b data-k="${k}" data-v="${v}" data-f="${f}">${f === 'c' ? dineroC(v) : v.toLocaleString('es-MX')}</b>`;
  return `<div class="kpi"><span class="mono">Eventos</span>${n('ev', vivos.length, 'n')}<em>${esc(et)} · ${conf.length} confirmados</em></div>
    <div class="kpi"><span class="mono">Personas</span>${n('pax', pax, 'n')}<em>confirmadas y tentativas</em></div>
    <div class="kpi"><span class="mono">Venta confirmada</span>${n('venta', venta, 'c')}<em>${dinero(venta)}</em></div>
    <div class="kpi ${cobrar ? 'alerta' : ''}"><span class="mono">Por cobrar</span>${n('cobrar', cobrar, 'c')}<em>saldo de confirmados</em></div>
    <div class="kpi"><span class="mono">En negociación</span>${n('embudo', embudo, 'c')}<em>prospecto, cotizado y tentativo</em></div>`;
}
/* los números cuentan hasta su valor nuevo al cambiar de mes o de vista */
function contarKpis(animar) {
  $$('#bajo .kpi b[data-k]').forEach(b => {
    const k = b.dataset.k, v = Number(b.dataset.v), f = b.dataset.f, antes = S.kpiPrev[k] ?? 0; S.kpiPrev[k] = v;
    const fmt = x => f === 'c' ? dineroC(Math.round(x)) : Math.round(x).toLocaleString('es-MX');
    if (!animar || antes === v || !movimiento()) { b.textContent = fmt(v); return; }
    const t0 = performance.now(), dur = 560;
    b.textContent = fmt(antes);
    const paso = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); b.textContent = fmt(antes + (v - antes) * e); if (p < 1 && b.isConnected) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

/* ---------------------------------------------------------------------
   CAJÓN DEL EVENTO
--------------------------------------------------------------------- */
const CAMPOS = ['unidad', 'nombre', 'tipo', 'estatus', 'fecha', 'hora_inicio', 'hora_fin', 'pax', 'espacio', 'cliente', 'empresa', 'telefono', 'correo', 'origen',
  'paquete', 'total', 'anticipo', 'limite_anticipo', 'responsable', 'apoyo', 'alimentos', 'bebidas', 'montaje', 'notas', 'exclusivo'];
const NUMS = ['pax', 'total', 'anticipo'];
const ETIQ = { unidad: 'unidad', nombre: 'nombre', tipo: 'tipo', estatus: 'estatus', fecha: 'fecha', hora_inicio: 'hora de inicio', hora_fin: 'hora de fin', pax: 'personas',
  espacio: 'espacio', cliente: 'contacto', empresa: 'empresa', telefono: 'teléfono', correo: 'correo', origen: 'cómo llegó', paquete: 'paquete', total: 'total',
  anticipo: 'anticipo', limite_anticipo: 'fecha límite del anticipo', responsable: 'responsable', apoyo: 'apoyo', alimentos: 'alimentos', bebidas: 'bebidas',
  montaje: 'montaje', notas: 'notas', exclusivo: 'uso exclusivo' };
const evActual = () => S.cj && S.cj.id ? S.eventos.find(x => x.id === S.cj.id) : null;
function formDe(e) {
  const f = { id: e.id || null };
  CAMPOS.forEach(k => { let v = e[k]; if ((k === 'hora_inicio' || k === 'hora_fin') && v) v = String(v).slice(0, 5); f[k] = k === 'exclusivo' ? !!v : (v ?? ''); });
  return f;
}
const igual = (k, a, b) => k === 'exclusivo' ? !!a === !!b : NUMS.includes(k) ? num(a) === num(b) : String(a ?? '').trim() === String(b ?? '').trim();
function aDB(k, v) {
  if (k === 'exclusivo') return !!v;
  if (NUMS.includes(k)) { const n = num(v); return n === null ? null : (k === 'pax' ? Math.round(n) : Math.round(n * 100) / 100); }

function abrirEvento(id, fechaNueva, base, reemplazar, tab) {

    const e = S.eventos.find(x => x.id === id);
    if (!e) return toast('Ese evento ya no está en el calendario (pudo irse a la papelera).', 1);
    form = formDe(e); version = e.updated_at;
  } else form = formDe(Object.assign({ unidad: S.unidad !== 'TODAS' ? S.unidad : 'EGO', estatus: 'Cotizado', fecha: fechaNueva || S.dia }, base || {}));
  const detalles = !!id || CAMPOS.some(k => !RAPIDOS.includes(k) && form[k] !== '' && form[k] !== false && form[k] !== null);
  S.cj = { id: id || null, tab: id && tab ? tab : 'datos', form, orig: formDe(form), version, sucio: false, bit: null, arch: null, cambioRemoto: false,
    subiendo: null, guardando: false, detalles, recien: null };
  if (reemplazar && $('.cajon[data-tipo="evento"]')) { pintarCajon(); $('#cjB').scrollTop = 0; }
  else {
    S.foco = document.activeElement;
    $('#capa').innerHTML = `<div class="velo" data-a="atras"></div><aside class="cajon" data-tipo="evento" role="dialog" aria-modal="true" aria-label="Evento"></aside>`;
    pintarCajon();

    document.body.style.overflow = 'hidden';

function ligarForm() {

  });
  b.querySelectorAll('[data-grupo]').forEach(g => g.addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-v]'); if (!btn) return;

    alCambiarCampo(null, g.dataset.grupo);

/* actualiza lo que depende del campo, sin volver a pintar el formulario (no se pierde el teclado ni el cursor) */
function alCambiarCampo(i, k0) {
  const c = S.cj; if (!c) return; const f = c.form, k = k0 || i.dataset.k;

function marcarSucio() {

/* ---------- guardar (con protección cuando dos personas editan a la vez) ---------- */
async function guardarEvento() {
  const c = S.cj; if (!c || c.guardando) return; const f = c.form;
  const marcarMal = k => { const el = $(`#cjB [data-k="${k}"]`); if (el) { el.classList.add('mal'); el.focus(); } };
  if (c.tab !== 'datos') { c.tab = 'datos'; pintarCajon(); }
  if (!String(f.nombre).trim()) { marcarMal('nombre'); return toast('Falta el nombre del evento', 1); }
  if (!f.fecha) { toast('Falta la fecha', 1); $('#f-fecha')?.closest('.fecha')?.querySelector('.fecha-v')?.classList.add('mal'); return; }
  for (const k of NUMS) if (String(f[k]).trim() !== '' && (num(f[k]) === null || num(f[k]) < 0)) { marcarMal(k); return toast('Revisa: ' + ETIQ[k], 1); }
  if (num(f.anticipo) && num(f.total) && num(f.anticipo) > num(f.total)) { marcarMal('anticipo'); return toast('El anticipo no puede ser mayor que el total', 1); }
  const prev = evActual();
  const mueve = !prev || prev.fecha !== f.fecha || prev.unidad !== f.unidad || prev.estatus === 'Cancelado';
  const bq = mueve && f.estatus !== 'Cancelado' && bloqueoPara(f.fecha, f.unidad, c.id);
  if (bq) return toast(`El ${fFecha(f.fecha)} está bloqueado: ${bq.motivo}`, 1);
  c.guardando = true; pintarPie();
  try { if (!c.id) await crearEvento(f); else await actualizarEvento(f); }
  catch (e) { toast('No se guardó. ' + msgError(e) + ' Tus datos siguen en pantalla.', 1); }
  finally { if (S.cj === c) { c.guardando = false; pintarPie(); } }
}
async function crearEvento(f) {
  const datos = {}; CAMPOS.forEach(k => datos[k] = aDB(k, f[k]));
  const r = await S.api.crear(datos);
  S.eventos = ordenarEv([...S.eventos, r]);
  if (r.exclusivo) await recargarBloqueos();
  avisar(r.id); toast('Evento creado. Agrega lo que falta para que salga bien.');
  S.dia = r.fecha; S.mes = mesDe(r.fecha); renderVista();
  S.cj.guardando = false;
  abrirEvento(r.id, null, null, true); S.cj.tab = 'pend'; pintarCajon();
}
async function actualizarEvento(f) {
  const c = S.cj, cambios = {};
  CAMPOS.forEach(k => { if (!igual(k, f[k], c.orig[k])) cambios[k] = aDB(k, f[k]); });
  if (!Object.keys(cambios).length) { c.sucio = false; return; }
  let r = await S.api.guardar(c.id, cambios, c.version), nota = 'Cambios guardados';
  if (r.conflicto) {
    await recargarEvento(c.id);
    const act = evActual();
    if (!act) { toast('Alguien mandó este evento a la papelera mientras lo editabas. Tus cambios no se guardaron.', 1); renderVista(); return cerrarForzado(); }
    const fa = formDe(act), quien = act.actualizado_por || 'Alguien';
    const choque = Object.keys(cambios).filter(k => !igual(k, fa[k], c.orig[k]) && !igual(k, fa[k], f[k]));
    if (choque.length) {
      const op = await elegir(`${quien} también cambió este evento`,
        `Mientras editabas, ${quien} cambió: ${choque.map(k => ETIQ[k]).join(', ')}.\n\n¿Con cuál versión te quedas en esos datos? Lo demás que cambiaste se guarda igual.`,
        [['suya', `Lo de ${quien}`, 'btn-s'], ['mia', 'Lo mío', 'btn-p']]);
      if (!op) return;
      if (op === 'suya') choque.forEach(k => { delete cambios[k]; });
    }
    if (!Object.keys(cambios).length) { aplicarGuardado(act, {}); return toast(`Se quedó la versión de ${quien}.`); }
    r = await S.api.guardar(c.id, cambios, act.updated_at);
    if (r.conflicto) { await recargarEvento(c.id); c.cambioRemoto = true; pintarCuerpo(); return toast('El evento sigue cambiando. Revisa y vuelve a guardar.', 1); }
    nota = choque.length ? 'Cambios guardados' : `Guardado. También se conservaron los cambios de ${quien}.`;
  }
  aplicarGuardado(r, cambios); toast(nota);
}
function aplicarGuardado(r, cambios) {
  const c = S.cj;

  Object.assign(c, { version: r.updated_at, form: formDe(r), orig: formDe(r), sucio: false, cambioRemoto: false });
  const tocaBloqueo = ['exclusivo', 'fecha', 'unidad', 'estatus', 'nombre'].some(k => k in cambios);
  avisar(r.id); renderVista(); pintarCajon(); cargarBit();

/* otra persona guardó: se traen sus cambios y se conservan los míos que no chocan */
async function fusionarRemoto() {
  const c = S.cj, e = evActual(); if (!c || !e) return;
  const fa = formDe(e), quien = e.actualizado_por || 'otra persona';
  const mios = CAMPOS.filter(k => !igual(k, c.form[k], c.orig[k]));
  const choque = mios.filter(k => !igual(k, fa[k], c.orig[k]) && !igual(k, fa[k], c.form[k]));
  let quedarme = true;
  if (choque.length) {
    const op = await elegir(`${quien} cambió lo mismo que tú`, `Los dos cambiaron: ${choque.map(k => ETIQ[k]).join(', ')}. ¿Con cuál te quedas en esos datos?`,
      [['suya', `Lo de ${quien}`, 'btn-s'], ['mia', 'Lo mío', 'btn-p']]);
    if (!op) return; quedarme = op === 'mia';
  }
  const nuevo = { ...fa }; mios.forEach(k => { if (!choque.includes(k) || quedarme) nuevo[k] = c.form[k]; });
  Object.assign(c, { form: nuevo, orig: fa, version: e.updated_at, cambioRemoto: false });
  c.sucio = CAMPOS.some(k => !igual(k, c.form[k], c.orig[k]));
  pintarCajon(); toast(`Se cargaron los cambios de ${quien}` + (c.sucio ? '. Lo tuyo sigue sin guardar.' : '.'));
}
function refrescarCajonRemoto() {

  if (e.updated_at !== c.version) {
    const remotos = CAMPOS.filter(k => !igual(k, formDe(e)[k], c.orig[k]));
    if (!remotos.length) c.version = e.updated_at;                  // solo cambió lo pagado: no hay nada que avisar
    else if (!c.sucio) Object.assign(c, { form: formDe(e), orig: formDe(e), version: e.updated_at });

  }
