/* fotos grandes del celular: se reducen a 2000 px y JPEG antes de subir (menos datos y menos espacio en Supabase) */
async function comprimir(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 700 * 1024 || typeof createImageBitmap !== 'function') return file;
  const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, 2000 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  if (!blob || blob.size >= file.size) return file;
  return new File([blob], file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
}
async function subir(files) {
  const c = S.cj; if (!c || !files.length) return;
  if (c.subiendo) return toast('Espera a que terminen de subir los archivos anteriores', 1);
  c.subiendo = { total: files.length, hecho: 0, nombre: '' }; let bien = 0;
  for (const f0 of files) {
    c.subiendo.nombre = f0.name; if (S.cj === c && c.tab === 'arch') pintarCuerpo();
    let f = f0; try { f = await comprimir(f0); } catch (e) { console.warn(e); }
    if (f.size > 25 * 1048576) toast(`${f0.name} pesa más de 25 MB`, 1);
    else {
      try { await S.api.subir(c.id, f); bien++; }
      catch (e) {
        const m = msgError(e);
        toast(`No se subió ${f0.name}. ` + (/permiso/.test(m) ? 'Supabase no dio permiso para guardar archivos: quien administra el calendario debe correr otra vez esquema.sql.' : m), 1);
      }
    }
    c.subiendo.hecho++;
  }
  c.subiendo = null;
  if (bien) { toast(bien === 1 ? 'Archivo guardado' : `${bien} archivos guardados`); avisar(c.id); }
  if (S.cj === c) { pintarCuerpo(); cargarArch(); }
}

        { t: 'Abrir evento', ico: ICO.abrir, f: () => abrirEvento(e.id) },
        { t: 'Registrar pago', ico: ICO.pago, f: () => abrirEvento(e.id, null, null, false, 'pagos') },
        { t: pe.length ? `Pendientes · ${listos} de ${pe.length} listos` : 'Pendientes', ico: ICO.lista, f: () => abrirEvento(e.id, null, null, false, 'pend') },
        ...(e.estatus !== 'Cancelado' ? [{ t: 'Mover a otro día', ico: ICO.mover, f: () => empezarMover(e.id) }] : []),
        '-',
        ...(tel ? [{ t: 'WhatsApp al cliente', ico: ICO.chat, f: () => abrirWA(tel) }] : []),
        { t: 'Compartir resumen', ico: ICO.compartir, f: () => compartirResumen(e) },
        { t: 'Imprimir orden de servicio', ico: ICO.imprimir, f: () => imprimirOrden(e) }
      ]);
    }
    case 'bloquear': {
      const r = await dialogoBloqueo(v); if (!r) return;
      try { S.bloq.push(await S.api.bloquear({ fecha: v, ...r })); avisar(); toast('Día bloqueado'); renderVista(); } catch (e) { toast('No se bloqueó. ' + msgError(e), 1); }
      return;
    }
    case 'desbloquear': {
      const b = S.bloq.find(x => x.id === el.dataset.id); if (!b) return;
      const e2 = b.evento_id && S.eventos.find(e => e.id === b.evento_id);
      if (!await confirmar('¿Desbloquear el día?', `Se podrá volver a agendar en ${b.unidad ? UNIDADES[b.unidad] : 'las tres unidades'} el ${fFecha(b.fecha)}.${e2 ? '\n\nEl bloqueo viene del evento «' + e2.nombre + '»: se le quita el uso exclusivo.' : ''}`, 'Desbloquear')) return;
      try { await S.api.desbloquear(b.id); S.bloq = S.bloq.filter(x => x.id !== b.id); if (e2) { await recargarEvento(e2.id); avisar(e2.id); } else avisar(); toast('Día desbloqueado'); renderVista(); }
      catch (e) { toast('No se desbloqueó. ' + msgError(e), 1); }
      return;
    }
    case 'tab': {
      if (!S.cj) return; S.cj.tab = v; pintarTabs(); pintarCuerpo(); pintarPie(); $('#cjB').scrollTop = 0;
      if (v === 'bit' && (S.cj.bit === null || S.cj.bit === false)) { S.cj.bit = null; pintarCuerpo(); cargarBit(); } else if (v === 'bit') cargarBit();
      if (v === 'arch') { if (S.cj.arch === false) { S.cj.arch = null; pintarCuerpo(); } cargarArch(); }
      return;
    }
    case 'mas-detalles': {
      if (!S.cj) return; S.cj.detalles = true; pintarCuerpo();
      const t = $('#f-tipo'); if (!t) return;
      t.scrollIntoView({ block: 'center', behavior: movimiento() ? 'smooth' : 'auto' });
      if (!tactil()) t.focus({ preventScroll: true });
      return;
    }
    case 'guardar': return guardarEvento();
    case 'ver-remoto': return fusionarRemoto();
    case 'pg-sug': { const i = $('#pgM'); if (i) { i.value = v; i.classList.remove('mal'); i.focus(); } return; }
    case 'pg-x': return borrarPago(el.dataset.id);
    case 'pend-sug': return agregarPend(v);
    case 'pend-todos': { if (!S.cj) return; const usados = new Set(pendDe(S.cj.id).map(p => p.texto)); return agregarVarios(SUGERIDOS.filter(s => !usados.has(s))); }
    case 'pend-ok': {
      const p = S.pend.find(x => x.id === el.dataset.id); if (!p) return;
      const antes = p.hecho; p.hecho = el.checked; p.hecho_por = el.checked ? S.yo : null;
      if (S.cj && p.hecho) S.cj.recien = p.id;
      pintarCuerpo(); pintarTabs(); renderVista();
      try { const r = await S.api.marcarPend(p.id, p.hecho); Object.assign(p, r); avisar(p.evento_id); }
      catch (e) { p.hecho = antes; toast('No se guardó. ' + msgError(e), 1); if (S.cj) { pintarCuerpo(); pintarTabs(); } renderVista(); }
      return;
    }
    case 'pend-x': {
      const p = S.pend.find(x => x.id === el.dataset.id); if (!p) return;
      if (!await confirmar('¿Quitar pendiente?', `«${p.texto}»`, 'Quitar pendiente', true)) return;
      try { await S.api.borrarPend(p.id); S.pend = S.pend.filter(x => x.id !== p.id); avisar(p.evento_id); if (S.cj) { pintarCuerpo(); pintarTabs(); } renderVista(); }
      catch (e) { toast('No se quitó. ' + msgError(e), 1); }
      return;
    }
    case 'arch-ver': {
      const x = (S.cj.arch || []).find(y => y.id === el.dataset.id); if (!x) return;
      const w = S.api.demo ? null : window.open('', '_blank');
      try { const u = await S.api.urlArchivo(x.ruta); if (!u) { if (w) w.close(); return toast('En la demostración este archivo es de ejemplo y no se puede abrir', 1); } if (w) w.location = u; else window.open(u, '_blank') || (location.href = u); }
      catch (e) { if (w) w.close(); toast('No se pudo abrir. ' + msgError(e), 1); }
      return;
    }
    case 'arch-x': {
      const x = (S.cj.arch || []).find(y => y.id === el.dataset.id); if (!x) return;
      if (!await confirmar('¿Eliminar archivo?', `«${x.nombre}» se borra para todos y no se puede recuperar.`, 'Eliminar archivo', true)) return;
      try { await S.api.borrarArchivo(x); avisar(S.cj.id); toast('Archivo eliminado'); cargarArch(); } catch (e) { toast('No se eliminó. ' + msgError(e), 1); }
      return;
    }
    case 'rest': return restaurarEvento(el.dataset.id);
    case 'purgar': return purgarEvento(el.dataset.id, el.dataset.n);
    case 'papelera-re': return pintarPapelera();
    case 'mas-ev': {
      const e = evActual(); if (!e) return;
      const tel = telWA(e.telefono);
      return menu(el, [
        ...(e.estatus !== 'Cancelado' ? [{ t: 'Mover a otro día', ico: ICO.mover, f: () => empezarMover(e.id) }] : []),
        { t: 'Duplicar evento', ico: ICO.copiar, f: async () => {
          if (S.cj.sucio && !await confirmar('¿Descartar cambios?', 'Tienes cambios sin guardar en este evento.', 'Descartar cambios', true)) return;
          const base = formDe(e); delete base.id; base.nombre = e.nombre + ' (copia)'; base.estatus = 'Cotizado'; base.exclusivo = false;
          abrirEvento(null, e.fecha, base, true); toast('Copia lista: revisa la fecha y guarda');
        } },
        '-',
        ...(tel ? [{ t: 'WhatsApp al cliente', ico: ICO.chat, f: () => abrirWA(tel) }] : []),
        { t: 'Compartir resumen', ico: ICO.compartir, f: () => compartirResumen(S.cj && S.cj.sucio ? { ...e, ...Object.fromEntries(CAMPOS.map(k => [k, aDB(k, S.cj.form[k])])) } : e) },
        { t: 'Imprimir orden de servicio', ico: ICO.imprimir, f: () => imprimirOrden(e) },
        { t: 'Agregar a Outlook, Teams o Google', ico: ICO.outlook, f: () => descargarICS(e) },
        '-',
        { t: 'Mandar a la papelera', ico: ICO.basura, x: 1, f: () => mandarAPapelera(e) }
      ]);
    }
    case 'menu': return menu(el, [
      { t: 'Papelera', ico: ICO.restaurar, f: abrirPapelera },
      { t: S.verCancel ? 'Ocultar cancelados' : 'Mostrar cancelados', ico: ICO.ojo, f: () => { S.verCancel = !S.verCancel; renderVista(); } },
      '-',
      { t: 'Exportar a Excel (CSV)', ico: ICO.bajar, f: exportarCSV },
      { t: 'Descargar respaldo completo', ico: ICO.respaldo, f: descargarRespaldo },
      ...(S.vista === 'mes' ? [{ t: 'Imprimir el mes', ico: ICO.imprimir, f: imprimirMes }] : []),
      ...(!tactil() ? [{ t: 'Atajos de teclado', ico: ICO.teclado, f: dialogoAtajos }] : []),
      '-',
      { t: 'Cerrar sesión en este equipo', ico: ICO.salir, x: 1, f: async () => {
        if (!await confirmar('¿Cerrar sesión aquí?', 'Para volver a entrar en este equipo necesitarás abrir otra vez tu enlace personal.', 'Cerrar sesión')) return;
        ls.del('llave'); ls.del('conexion'); location.reload();
      } },
      `${VERSION} · ${S.yo}`
    ]);
  }
});
document.addEventListener('dblclick', ev => {
  const d = ev.target.closest('.dia'); if (!d || ev.target.closest('.ev') || tactil() || S.moviendo) return;
  abrirEvento(null, d.dataset.v);
});
/* arrastrar con mouse: un evento a otro día (Mes) o una tarjeta a otra columna (Estatus) */
document.addEventListener('dragstart', ev => {
  const el = ev.target.closest && ev.target.closest('[data-drag]'); if (!el) return;
  S.arrastre = el.dataset.drag; cerrarMenu();
  try { ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'move'; } catch {}
  requestAnimationFrame(() => { el.classList.add('arrastrado'); document.body.classList.add('arrastrando'); });
});
document.addEventListener('dragend', () => {
  S.arrastre = null; document.body.classList.remove('arrastrando');
  $$('.arrastrado').forEach(x => x.classList.remove('arrastrado'));
  $$('.drop-ok,.drop-no').forEach(x => x.classList.remove('drop-ok', 'drop-no'));
  $$('.col.drop').forEach(x => x.classList.remove('drop'));
});
document.addEventListener('submit', ev => {
  const id = ev.target.id;
  if (id === 'fPend') { ev.preventDefault(); const i = $('#nPend'); const t = i.value; i.value = ''; agregarPend(t); }
  if (id === 'fPago') { ev.preventDefault(); registrarPago(); }
  if (id === 'fNota') {
    ev.preventDefault(); const t = $('#nNota').value.trim(); if (!t) return $('#nNota').focus();
    const b = ev.target.querySelector('button'); b.disabled = true; const cid = S.cj.id;
    S.api.nota(cid, t).then(() => { avisar(cid); toast('Actualización publicada'); if (S.cj && S.cj.id === cid) { $('#nNota').value = ''; b.disabled = false; cargarBit(); } })
      .catch(e => { toast('No se publicó. ' + msgError(e), 1); b.disabled = false; });
  }
});
document.addEventListener('keydown', ev => {
  const enCampo = ev.target.closest && ev.target.closest('input,textarea,select');
  if (ev.key === 'Escape') {
    if ($('.menu')) { cerrarMenu(); return; }
    if (capas.length) atras();
    return;
  }
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's' && S.cj && S.cj.tab === 'datos') { ev.preventDefault(); guardarEvento(); return; }
  if (enCampo || ev.metaKey || ev.ctrlKey || ev.altKey || !S.cargado) return;
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role=button],[role=gridcell]')) { ev.preventDefault(); ev.target.click(); return; }
  if (capas.some(c => c.n !== 'mover') || $('.dlg-velo') || $('.menu')) return;
  if (ev.target.matches && ev.target.matches('.dia') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) {
    ev.preventDefault(); const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
    seleccionarDia(sumaDias(S.dia, d), Math.sign(d));
    requestAnimationFrame(() => document.querySelector(`.dia[data-v="${S.dia}"]`)?.focus()); return;
  }
  if (S.vista === 'mes' && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) { cambiarMes(ev.key === 'ArrowLeft' ? -1 : 1); return; }
  const k = ev.key.toLowerCase();
  if (k === 'n') { ev.preventDefault(); abrirEvento(null, S.vista === 'mes' ? S.dia : hoyISO()); }
  else if (k === 't') irHoy();
  else if (k === '/') { ev.preventDefault(); abrirBusqueda(); }
  else if (k === '1' || k === '2' || k === '3') cambiarVista(['mes', 'agenda', 'tablero'][Number(k) - 1]);
});
/* si pegan su enlace en la barra con la página ya abierta, entra sin recargar a mano */
window.addEventListener('hashchange', () => {
  if (!/(^#|&)k=/.test(location.hash)) return;
  leerEnlace(); if (S.cargado) location.reload(); else iniciar();
});
window.addEventListener('beforeunload', ev => { if (S.cj && S.cj.sucio) { ev.preventDefault(); ev.returnValue = ''; } });
let tRes = null, ultW = innerWidth, ultH = innerHeight;
window.addEventListener('resize', () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => {
    if (!S.cargado) return;
    const soloTeclado = innerWidth === ultW && Math.abs(innerHeight - ultH) > 100 && document.activeElement && document.activeElement.matches('input,textarea');
    ultW = innerWidth; ultH = innerHeight; if (soloTeclado) return;
    cerrarMenu(); moverIndicador($('#vistas'), true); moverIndicador($('#segRango'), true);
    if (S.vista === 'mes' && !(S.buscando && S.q.trim())) ajustarCal();
  }, 140);
});

iniciar();
</script>
