<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGO Panadería — Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #2d4a3e;
    --verde-claro: #3d6b58;
    --cafe: #7a5c3f;
    --pergamino: #f5f0e8;
    --pergamino-oscuro: #ede5d4;
    --texto: #1e1e1e;
    --gris: #888;
    --blanco: #fff;
    --sombra: 0 4px 24px rgba(45,74,62,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--pergamino);
    color: var(--texto);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #screen-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(145deg, var(--verde) 0%, var(--verde-claro) 100%);
  }

  .login-box {
    background: var(--pergamino);
    border-radius: 18px;
    padding: 48px 40px 40px;
    width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }

  .login-logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--verde);
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cafe);
    margin-bottom: 36px;
  }

  .login-box input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--pergamino-oscuro);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    background: var(--blanco);
    color: var(--texto);
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .login-box input:focus { border-color: var(--verde-claro); }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--verde);
    color: var(--blanco);
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }

  .btn-primary:hover { background: var(--verde-claro); }
  .btn-primary:active { transform: scale(0.98); }

  .login-error {
    color: #c0392b;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 20px;
  }

  /* ── APP SHELL ── */
  #screen-app { display: none; flex-direction: column; min-height: 100vh; }

  .topbar {
    background: var(--verde);
    color: var(--blanco);
    padding: 0 20px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .topbar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .topbar-right { display: flex; align-items: center; gap: 14px; }

  .topbar-user {
    font-size: 0.82rem;
    opacity: 0.8;
  }

  .cart-btn {
    background: var(--cafe);
    color: var(--blanco);
    border: none;
    border-radius: 20px;
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }

  .cart-btn:hover { background: #8d6b4a; }

  .cart-count {
    background: var(--blanco);
    color: var(--cafe);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .logout-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--blanco);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.2s;
  }

  .logout-btn:hover { background: rgba(255,255,255,0.1); }

  /* ── CATÁLOGO ── */
  #screen-catalogo {
    padding: 24px 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  .catalogo-header {
    margin-bottom: 20px;
  }

  .catalogo-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--verde);
  }

  .catalogo-header p {
    font-size: 0.85rem;
    color: var(--gris);
    margin-top: 2px;
  }

  .categoria-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--cafe);
    margin: 28px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--pergamino-oscuro);
    letter-spacing: 0.3px;
  }

  .productos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .producto-card {
    background: var(--blanco);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--sombra);
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .producto-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(45,74,62,0.13);
  }

  .producto-nombre {
    font-weight: 500;
    font-size: 0.92rem;
    line-height: 1.3;
    color: var(--texto);
  }

  .producto-precio {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    color: var(--verde);
    font-weight: 600;
  }

  .producto-unidad {
    font-size: 0.75rem;
    color: var(--gris);
    margin-top: -6px;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--verde-claro);
    background: var(--blanco);
    color: var(--verde);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }

  .qty-btn:hover { background: var(--verde); color: var(--blanco); }

  .qty-value {
    min-width: 28px;
    text-align: center;
    font-weight: 600;
    font-size: 0.95rem;
  }

  /* ── CARRITO MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--pergamino);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 24px 32px;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--verde);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--gris);
    line-height: 1;
  }

  .carrito-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--pergamino-oscuro);
    font-size: 0.9rem;
  }

  .carrito-item-nombre { flex: 1; }

  .carrito-item-qty {
    color: var(--gris);
    margin: 0 12px;
    white-space: nowrap;
  }

  .carrito-item-precio {
    font-weight: 600;
    color: var(--verde);
    min-width: 70px;
    text-align: right;
  }

  .carrito-item-del {
    background: none;
    border: none;
    color: #c0392b;
    cursor: pointer;
    font-size: 1rem;
    margin-left: 10px;
    opacity: 0.6;
  }

  .carrito-item-del:hover { opacity: 1; }

  .carrito-total {
    display: flex;
    justify-content: space-between;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--verde);
    margin-top: 16px;
    padding-top: 12px;
  }

  .carrito-vacio {
    text-align: center;
    color: var(--gris);
    padding: 32px 0;
    font-size: 0.9rem;
  }

  .notas-label {
    display: block;
    font-size: 0.82rem;
    color: var(--gris);
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .notas-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--pergamino-oscuro);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    resize: none;
    background: var(--blanco);
    outline: none;
  }

  .notas-input:focus { border-color: var(--verde-claro); }

  .btn-pedido {
    width: 100%;
    padding: 15px;
    background: var(--verde);
    color: var(--blanco);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-pedido:hover { background: var(--verde-claro); }
  .btn-pedido:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── CONFIRMACIÓN ── */
  #screen-confirmacion {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 40px 24px;
    background: var(--verde);
    color: var(--blanco);
  }

  .confirm-icon { font-size: 4rem; margin-bottom: 20px; }

  .confirm-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 12px;
  }

  .confirm-sub {
    font-size: 0.95rem;
    opacity: 0.8;
    max-width: 320px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn-wa {
    background: #25D366;
    color: var(--blanco);
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .btn-wa:hover { opacity: 0.9; }

  .btn-nuevo-pedido {
    background: rgba(255,255,255,0.15);
    color: var(--blanco);
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-nuevo-pedido:hover { background: rgba(255,255,255,0.25); }

  .confirm-btns { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* ── HISTORIAL ── */
  #screen-historial {
    display: none;
    padding: 24px 20px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
  }

  .historial-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .historial-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--verde);
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--verde);
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'DM Sans', sans-serif;
    padding: 0;
  }

  .pedido-card {
    background: var(--blanco);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--sombra);
  }

  .pedido-card-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .pedido-folio {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--verde);
  }

  .pedido-fecha {
    font-size: 0.8rem;
    color: var(--gris);
  }

  .pedido-items {
    font-size: 0.85rem;
    color: var(--gris);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .pedido-total-tag {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--cafe);
    font-weight: 600;
  }

  .historial-vacio {
    text-align: center;
    color: var(--gris);
    padding: 48px 0;
    font-size: 0.9rem;
  }

  /* ── NAV BOTTOM ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--blanco);
    border-top: 1px solid var(--pergamino-oscuro);
    display: flex;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    z-index: 99;
  }

  .nav-btn {
    flex: 1;
    padding: 12px 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    color: var(--gris);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--verde); }
  .nav-btn .nav-icon { font-size: 1.3rem; }

  .app-content { padding-bottom: 70px; }

  @media (min-width: 600px) {
    .bottom-nav { display: none; }
    .topbar { gap: 20px; }
    .app-content { padding-bottom: 20px; }
    #screen-catalogo, #screen-historial { padding: 32px 32px; }
  }

  /* ── ADMIN ── */
  #screen-admin {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    background: var(--pergamino);
  }

  .admin-topbar {
    background: var(--cafe);
    color: var(--blanco);
    padding: 0 24px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .admin-topbar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .admin-content {
    padding: 28px 24px;
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
  }

  .admin-section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--cafe);
    margin-bottom: 16px;
  }

  .admin-form {
    background: var(--blanco);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--sombra);
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .admin-form input {
    padding: 11px 14px;
    border: 1.5px solid var(--pergamino-oscuro);
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    background: var(--pergamino);
    transition: border-color 0.2s;
  }

  .admin-form input:focus { border-color: var(--cafe); }

  .admin-form .btn-add {
    grid-column: 1 / -1;
    padding: 12px;
    background: var(--cafe);
    color: var(--blanco);
    border: none;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .admin-form .btn-add:hover { background: #8d6b4a; }

  .admin-msg {
    grid-column: 1 / -1;
    font-size: 0.85rem;
    color: var(--verde-claro);
    min-height: 18px;
    text-align: center;
  }

  .cliente-row {
    background: var(--blanco);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--sombra);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .cliente-row-info { flex: 1; }

  .cliente-row-nombre {
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--texto);
  }

  .cliente-row-meta {
    font-size: 0.78rem;
    color: var(--gris);
    margin-top: 2px;
  }

  .btn-del-cliente {
    background: none;
    border: 1.5px solid #e74c3c;
    color: #e74c3c;
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .btn-del-cliente:hover { background: #e74c3c; color: var(--blanco); }

  .clientes-vacio {
    text-align: center;
    color: var(--gris);
    padding: 32px 0;
    font-size: 0.9rem;
  }

  .login-admin-link {
    margin-top: 14px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }

  .login-admin-link:hover { color: rgba(255,255,255,0.9); }

  /* ── ADMIN TABS ── */
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .admin-tab {
    flex: 1; padding: 10px; border: 2px solid var(--pergamino-oscuro);
    border-radius: 10px; background: var(--blanco);
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 500;
    cursor: pointer; color: var(--gris); transition: all 0.2s; text-align: center;
  }
  .admin-tab.active { border-color: var(--cafe); color: var(--cafe); background: #fdf6ee; }
  .admin-panel { display: none; }
  .admin-panel.active { display: block; }
  .producto-admin-row {
    background: var(--blanco); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; box-shadow: var(--sombra); display: flex; align-items: center; gap: 10px;
  }
  .producto-admin-info { flex: 1; }
  .producto-admin-nombre { font-weight: 500; font-size: 0.88rem; color: var(--texto); }
  .producto-admin-cat { font-size: 0.75rem; color: var(--gris); margin-top: 1px; }
  .producto-admin-precio { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--verde); font-weight: 600; min-width: 55px; text-align: right; }
  .btn-edit-prod {
    background: none; border: 1.5px solid var(--verde-claro); color: var(--verde);
    border-radius: 7px; padding: 5px 10px; font-size: 0.78rem; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.2s, color 0.2s;
  }
  .btn-edit-prod:hover { background: var(--verde); color: var(--blanco); }
  .admin-form select {
    padding: 11px 14px; border: 1.5px solid var(--pergamino-oscuro); border-radius: 9px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none;
    background: var(--pergamino); transition: border-color 0.2s; -webkit-appearance: none;
  }
  .admin-form select:focus { border-color: var(--cafe); }
  .cat-header-admin { font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; color: var(--cafe); margin: 16px 0 8px; font-weight: 600; }
</style>
</head>
<body>

<!-- ════ LOGIN ════ -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-logo">EGO</div>
    <div class="login-sub">Panadería · Pedidos</div>
    <input type="text" id="login-user" placeholder="Usuario" autocomplete="off" />
    <input type="password" id="login-pass" placeholder="Contraseña" />
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
    <button class="login-admin-link" onclick="goAdmin()">⚙️ Acceso administrador</button>
  </div>
</div>

<!-- ════ ADMIN ════ -->
<div id="screen-admin">
  <div class="admin-topbar">
    <span class="admin-topbar-title">⚙️ EGO Admin</span>
    <button class="logout-btn" onclick="salirAdmin()">Salir</button>
  </div>
  <div class="admin-content">
    <div class="admin-tabs">
      <button class="admin-tab active" id="atab-clientes" onclick="switchAdminTab('clientes')">👥 Clientes</button>
      <button class="admin-tab" id="atab-productos" onclick="switchAdminTab('productos')">🍞 Productos</button>
      <button class="admin-tab" id="atab-pedidos" onclick="switchAdminTab('pedidos')">📋 Pedidos</button>
    </div>

    <!-- PANEL CLIENTES -->

async function supabaseFetch(path, options = {}) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation',
    'Access-Control-Allow-Origin': '*',
    ...( options.headers || {})
  };
  const resp = await fetch(url, { ...options, headers, mode: 'cors' });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(errText);
  }
  const text = await resp.text();
  return text ? JSON.parse(text) : [];
}

          <button class="qty-btn" onclick="cambiarQty('${prod.id}', 1)">+</button>
        </div>
      `;
      grid.appendChild(card);
    });
    cont.appendChild(grid);
  });
}

function getProd(id) {
  for (const cat of CATALOGO) {
    const p = cat.productos.find(x => x.id === id);
    if (p) return p;
  }
  return null;
}

function cambiarQty(id, delta) {
  const prod = getProd(id);
  if (!prod) return;
  const actual = carrito[id]?.qty || 0;
  const nueva = Math.max(0, actual + delta);
  if (nueva === 0) {
    delete carrito[id];
  } else {
    carrito[id] = { ...prod, qty: nueva };
  }
  document.getElementById('qty-' + id).textContent = nueva;
  updateCartCount();
}

function updateCartCount() {
  const total = Object.values(carrito).reduce((s, i) => s + i.qty, 0);
  document.getElementById('cart-count').textContent = total;
}

function confirmarPedido() {
  const items = Object.values(carrito);
  if (items.length === 0) return;

  // Bloqueo de horario: pedidos solo de 10:00am a 2:00am
  const ahora = new Date();
  const hora = ahora.getHours();
  const minutos = ahora.getMinutes();
  const horaDecimal = hora + minutos / 60;
  // Bloqueado entre 2:00am (2.0) y 10:00am (10.0)
  if (horaDecimal >= 2.0 && horaDecimal < 10.0) {
    alert('⏰ Los pedidos están disponibles de 10:00 AM a 2:00 AM.\nVuelve después de las 10:00 AM.');
    return;
  }

  const notas = document.getElementById('pedido-notas').value.trim();
  const total = items.reduce((s, i) => s + i.precio * i.qty, 0);
  const folio = 'PED-' + Date.now().toString().slice(-6);
  const fecha = new Date().toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });

  ultimoPedido = { folio, fecha, cliente: currentUser.nombre, items, total, notas };

  // Guardar en historial local
  historial.unshift(ultimoPedido);
  localStorage.setItem('historial_' + currentUser.usuario, JSON.stringify(historial));

  // Guardar en registro global de admin
  const todosLos = JSON.parse(localStorage.getItem('ego_todos_pedidos') || '[]');
  todosLos.unshift(ultimoPedido);
  localStorage.setItem('ego_todos_pedidos', JSON.stringify(todosLos.slice(0, 500)));

  // Enviar a Google Sheets (si está configurado)
  if (APPS_SCRIPT_URL) enviarASheets(ultimoPedido);

  // Armar mensajes WhatsApp
  const msgCliente = armarMensaje(ultimoPedido, false);
  const msgEGO     = armarMensaje(ultimoPedido, true);

  document.getElementById('btn-wa-cliente').href =
    `https://wa.me/${currentUser.whatsapp}?text=${encodeURIComponent(msgCliente)}`;

  // Guardar mensaje EGO para abrir después (o abrir automáticamente)
  window._waEGO = `https://wa.me/${WA_EGO}?text=${encodeURIComponent(msgEGO)}`;

  // Mostrar pantalla confirmación
  closeCarrito();
  document.getElementById('screen-app').style.display = 'none';
  const screen = document.getElementById('screen-confirmacion');
  screen.style.display = 'flex';
  screen.style.flexDirection = 'column';
  document.getElementById('confirm-detalle').textContent =
    `Pedido ${folio} · $${total.toFixed(2)} MXN\nSe notificará al equipo de EGO.`;

  // Abrir WA a EGO automáticamente
  setTimeout(() => { window.open(window._waEGO, '_blank'); }, 600);

  carrito = {};
  updateCartCount();
}

function armarMensaje(pedido, paraEGO) {
  const lineas = pedido.items.map(i => `  • ${i.nombre} ×${i.qty} — $${(i.precio * i.qty).toFixed(2)}`).join('\n');
  if (paraEGO) {
    return `🍞 *NUEVO PEDIDO — EGO Panadería*\n\n` +
      `📋 Folio: ${pedido.folio}\n` +
      `🏪 Cliente: ${pedido.cliente}\n` +
      `📅 Fecha: ${pedido.fecha}\n\n` +
      `*Productos:*\n${lineas}\n\n` +
      `💰 *Total: $${pedido.total.toFixed(2)} MXN*` +
      (pedido.notas ? `\n\n📝 Notas: ${pedido.notas}` : '');
  } else {
    return `Hola, gracias por tu pedido en *EGO Panadería* 🥐\n\n` +
      `Tu folio es *${pedido.folio}*\n\n` +
      `*Detalle:*\n${lineas}\n\n` +
      `💰 *Total: $${pedido.total.toFixed(2)} MXN*` +
      (pedido.notas ? `\n\n📝 Notas: ${pedido.notas}` : '') +
      `\n\nEn breve confirmaremos tu pedido. ¡Buen provecho!`;
  }
}

    await supabaseFetch('pedidos', {
      method: 'POST',
      body: JSON.stringify({
        fecha: pedido.fecha,
        folio: pedido.folio,
        cliente: pedido.cliente,
        productos: productosTexto,
        cant_items: cantItems,
        total: pedido.total,
        notas: pedido.notas || '',
        estado: 'Pendiente',
        fecha_pago: '',
        fecha_limite: fechaLimiteStr
      })
    });
    console.log('Pedido guardado en Supabase');
  } catch(e) {
    console.warn('No se pudo registrar pedido:', e);
    // Fallback: Apps Script
    try {
      const encoded = encodeURIComponent(JSON.stringify(pedido));
      const url = APPS_SCRIPT_URL + '?data=' + encoded;
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(() => { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 5000);
    } catch(e2) {}
  }
}

// ══════════════════════════════════════════
//  CATÁLOGO DINÁMICO
// ══════════════════════════════════════════
function getCatalogo() {
  const saved = localStorage.getItem('ego_catalogo');
  return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(CATALOGO));
}

function saveCatalogo(cat) {
  localStorage.setItem('ego_catalogo', JSON.stringify(cat));
}

function getProd(id) {
  const cat = getCatalogo();
  for (const c of cat) {
    const p = c.productos.find(x => x.id === id);
    if (p) return p;
  }
  return null;
}

// ══════════════════════════════════════════
//  ADMIN TABS
// ══════════════════════════════════════════
function switchAdminTab(tab) {
  ['clientes','productos','pedidos'].forEach(t => {
    document.getElementById('atab-' + t).classList.toggle('active', t === tab);
    document.getElementById('apanel-' + t).classList.toggle('active', t === tab);
  });
  if (tab === 'productos') renderAdminProductos();
  if (tab === 'pedidos') renderAdminPedidos();
}

function renderAdminPedidos() {
  const cont = document.getElementById('admin-lista-pedidos');
  const todos = JSON.parse(localStorage.getItem('ego_todos_pedidos') || '[]');
  const hoy = new Date().toLocaleDateString('es-MX', { dateStyle: 'short' });
  const pedidosHoy = todos.filter(p => p.fecha && p.fecha.startsWith(hoy));

  if (pedidosHoy.length === 0) {
    cont.innerHTML = '<div class="clientes-vacio">No hay pedidos hoy aún.</div>';
    return;
  }

  cont.innerHTML = pedidosHoy.map(p => `
    <div class="pedido-card">
      <div class="pedido-card-header">
        <span class="pedido-folio">${p.folio}</span>
        <span class="pedido-fecha">${p.fecha}</span>
      </div>
      <div style="font-weight:600;font-size:0.9rem;color:var(--cafe);margin-bottom:4px;">${p.cliente}</div>
      <div class="pedido-items">${p.items.map(i => `${i.nombre} ×${i.qty}`).join(' · ')}</div>
      ${p.notas ? `<div class="pedido-items">📝 ${p.notas}</div>` : ''}
      <div class="pedido-total-tag">$${p.total.toFixed(2)} MXN</div>
    </div>
  `).join('');
}

// ══════════════════════════════════════════
//  ADMIN PRODUCTOS
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('p-categoria');
  if (sel) sel.addEventListener('change', () => {
    const nueva = document.getElementById('p-cat-nueva');
    nueva.style.display = sel.value === 'Nueva categoría...' ? 'block' : 'none';
  });
});

function agregarProducto() {
  const nombre  = document.getElementById('p-nombre').value.trim();
  const precio  = parseFloat(document.getElementById('p-precio').value);
  const catSel  = document.getElementById('p-categoria').value;
  const catNueva= document.getElementById('p-cat-nueva').value.trim();
  const cat     = catSel === 'Nueva categoría...' ? catNueva : catSel;
  const msg     = document.getElementById('admin-msg-prod');

  if (!nombre || isNaN(precio) || !cat) {
    msg.style.color = '#e74c3c';
    msg.textContent = 'Completa todos los campos.';
    return;
  }

  const catalogo = getCatalogo();
  const id = 'custom-' + Date.now();

  let catObj = catalogo.find(c => c.categoria === cat);
  if (!catObj) {
    catObj = { categoria: cat, productos: [] };
    catalogo.push(catObj);
    // Actualizar select
    const sel = document.getElementById('p-categoria');
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    sel.insertBefore(opt, sel.lastElementChild);
  }

  catObj.productos.push({ id, nombre, precio, unidad: 'pieza' });
  saveCatalogo(catalogo);

  msg.style.color = '#2d4a3e';
  msg.textContent = `✅ "${nombre}" agregado.`;
  document.getElementById('p-nombre').value = '';
  document.getElementById('p-precio').value = '';
  document.getElementById('p-categoria').value = '';
  document.getElementById('p-cat-nueva').style.display = 'none';
  renderAdminProductos();
}

function editarProducto(id) {
  const prod = getProd(id);
  if (!prod) return;
  const nuevoNombre = prompt('Nombre:', prod.nombre);
  if (nuevoNombre === null) return;
  const nuevoPrecio = parseFloat(prompt('Precio ($):', prod.precio));
  if (isNaN(nuevoPrecio)) return;

  const catalogo = getCatalogo();
  for (const cat of catalogo) {
    const p = cat.productos.find(x => x.id === id);
    if (p) { p.nombre = nuevoNombre.trim() || p.nombre; p.precio = nuevoPrecio; break; }
  }
  saveCatalogo(catalogo);
  renderAdminProductos();
  renderCatalogo();
}

function eliminarProducto(id) {
  const prod = getProd(id);
  if (!prod) return;
  if (!confirm(`¿Eliminar "${prod.nombre}"?`)) return;
  const catalogo = getCatalogo();
  for (const cat of catalogo) {
    cat.productos = cat.productos.filter(p => p.id !== id);
  }
  saveCatalogo(catalogo.filter(c => c.productos.length > 0));
  renderAdminProductos();
  renderCatalogo();
}

function renderAdminProductos() {
  const cont = document.getElementById('admin-lista-productos');
  const catalogo = getCatalogo();
  let html = '';
  catalogo.forEach(cat => {
    html += `<div class="cat-header-admin">${cat.categoria}</div>`;
    cat.productos.forEach(p => {
      html += `
        <div class="producto-admin-row">
          <div class="producto-admin-info">
            <div class="producto-admin-nombre">${p.nombre}</div>
          </div>
          <div class="producto-admin-precio">$${p.precio}</div>
          <button class="btn-edit-prod" onclick="editarProducto('${p.id}')">✏️ Editar</button>
          <button class="btn-del-cliente" onclick="eliminarProducto('${p.id}')">✕</button>
        </div>`;
    });
  });
  cont.innerHTML = html || '<div class="clientes-vacio">No hay productos.</div>';
}

//  ADMIN
// ══════════════════════════════════════════
async function goAdmin() {
  const pass = prompt('Contraseña de administrador:');
  if (pass !== ADMIN_PASSWORD) {
    alert('Contraseña incorrecta.');
    return;
  }
  document.getElementById('screen-login').style.display = 'none';
  const adminScreen = document.getElementById('screen-admin');
  adminScreen.style.display = 'flex';
  adminScreen.style.flexDirection = 'column';
  renderAdminClientes();
}

function salirAdmin() {
  document.getElementById('screen-admin').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  // limpiar form
  ['a-nombre','a-usuario','a-password','a-whatsapp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('admin-msg').textContent = '';
}

async function agregarCliente() {
  const nombre   = document.getElementById('a-nombre').value.trim();
  const usuario  = document.getElementById('a-usuario').value.trim().toLowerCase();
  const password = document.getElementById('a-password').value;
  const whatsapp = document.getElementById('a-whatsapp').value.trim().replace(/\D/g,'');
  const msg      = document.getElementById('admin-msg');

  if (!nombre || !usuario || !password || !whatsapp) {
    msg.style.color = '#e74c3c';
    msg.textContent = 'Completa todos los campos.';
    return;
  }

  msg.style.color = '#888';
  msg.textContent = 'Guardando...';

  try {
    await supabaseFetch('clientes', {
      method: 'POST',
      body: JSON.stringify({ nombre, usuario, password, whatsapp })
    });
    msg.style.color = '#2d4a3e';
    msg.textContent = `✅ Cliente "${nombre}" guardado.`;
    ['a-nombre','a-usuario','a-password','a-whatsapp'].forEach(id => document.getElementById(id).value = '');
    renderAdminClientes();
  } catch(e) {
    msg.style.color = '#e74c3c';
    msg.textContent = e.message.includes('unique') ? 'Ese usuario ya existe.' : 'Error al guardar.';
  }
}

async function eliminarCliente(usuario) {
  if (!confirm(`¿Eliminar al cliente "${usuario}"?`)) return;
  try {
    await supabaseFetch(`clientes?usuario=eq.${usuario}`, { method: 'DELETE' });
    renderAdminClientes();
  } catch(e) {
    alert('Error al eliminar.');
  }
}

async function renderAdminClientes() {
  const cont = document.getElementById('admin-lista-clientes');
  cont.innerHTML = '<div class="clientes-vacio">Cargando...</div>';
  const clientes = await cargarClientesDesdeSheets();
  if (clientes.length === 0) {
    cont.innerHTML = '<div class="clientes-vacio">No hay clientes registrados aún.</div>';
    return;
  }
  cont.innerHTML = clientes.map(c => `
    <div class="cliente-row">
      <div class="cliente-row-info">
        <div class="cliente-row-nombre">${c.nombre}</div>
        <div class="cliente-row-meta">Usuario: ${c.usuario} · WA: ${c.whatsapp}</div>
      </div>
      <button class="btn-del-cliente" onclick="eliminarCliente('${c.usuario}')">Eliminar</button>
    </div>
  `).join('');
}
