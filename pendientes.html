<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendientes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0f11;
    --surface:   #17171a;
    --surface2:  #1e1e22;
    --border:    #2a2a2f;
    --border2:   #35353c;
    --text:      #e8e8ec;
    --muted:     #7a7a88;
    --accent:    #6c6cff;
    --accent-dim:#2d2d6e;
    --red:       #ff4d4d;
    --red-dim:   #4a1a1a;
    --yellow:    #f0a500;
    --yellow-dim:#3d2a00;
    --green:     #2ecc71;
    --green-dim: #0d3320;
    --radius:    8px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .user-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    transition: border-color 0.15s;
  }
  .user-pill:hover { border-color: var(--accent); color: var(--text); }
  .user-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--accent-dim);
  }
  .spacer { flex: 1; }
  .btn-new {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    font-family: var(--sans);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: opacity 0.15s;
  }
  .btn-new:hover { opacity: 0.85; }

  /* ── MAIN LAYOUT ── */
  .main { padding: 20px; max-width: 860px; margin: 0 auto; }

  /* ── SECTION LABEL ── */
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 24px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--border2); }
  .card.expanded { border-color: var(--border2); }

  .card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }

  .priority-dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex-shrink: 0;
  }
  .p-alta  { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .p-media { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .p-baja  { background: var(--green); box-shadow: 0 0 4px var(--green); }

  .card-title {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .card-title.done { text-decoration: line-through; color: var(--muted); }

  .card-meta {
    display: flex; align-items: center; gap: 8px;
  }
  .tag {
    font-size: 10px;
    font-family: var(--mono);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .tag-author { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
  .tag-status-pendiente { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
  .tag-status-progreso  { background: var(--accent-dim); color: var(--accent); border: 1px solid #4040aa; }
  .tag-status-listo     { background: var(--green-dim); color: var(--green); border: 1px solid #1a5e3a; }

  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
    margin-left: 4px;
  }
  .expanded .chevron { transform: rotate(90deg); }

  /* ── CARD BODY ── */
  .card-body {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
  }
  .card.expanded .card-body { display: block; }

  .card-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    padding: 10px 0 12px;
  }

  .card-actions {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .btn-sm {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--text); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }
  .btn-sm.success:hover { border-color: var(--green); color: var(--green); }

  /* ── NOTAS ── */
  .notas-section { padding-top: 10px; }
  .notas-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .nota-item {
    display: flex; gap: 8px;
    margin-bottom: 8px;
  }
  .nota-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: var(--accent);
    flex-shrink: 0; margin-top: 2px;
    font-family: var(--mono);
  }
  .nota-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    flex: 1;
  }
  .nota-meta { font-size: 10px; color: var(--muted); margin-bottom: 3px; font-family: var(--mono); }
  .nota-text { font-size: 13px; color: var(--text); line-height: 1.5; }

  .nota-input-row {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .nota-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .nota-input:focus { border-color: var(--accent); }
  .nota-input::placeholder { color: var(--muted); }
  .btn-nota {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--sans);
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-nota:hover { opacity: 0.85; }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }

  /* ── MODAL ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    width: 100%; max-width: 480px;
    padding: 24px;
  }
  .modal-title {
    font-size: 15px; font-weight: 600;
    margin-bottom: 18px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field select option { background: var(--surface2); }

  .priority-row {
    display: flex; gap: 8px;
  }
  .priority-option {
    flex: 1;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    color: var(--muted);
  }
  .priority-option[data-v="alta"].selected   { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .priority-option[data-v="media"].selected  { background: var(--yellow-dim); border-color: var(--yellow); color: var(--yellow); }
  .priority-option[data-v="baja"].selected   { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .priority-option:not(.selected):hover { border-color: var(--border2); color: var(--text); }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    background: none; border: 1px solid var(--border2);
    color: var(--muted); padding: 8px 16px;
    border-radius: 6px; font-size: 13px; font-family: var(--sans);
    cursor: pointer; transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  .btn-save {
    background: var(--accent); border: none;
    color: #fff; padding: 8px 20px;
    border-radius: 6px; font-size: 13px; font-weight: 500;
    font-family: var(--sans); cursor: pointer; transition: opacity 0.15s;
  }
  .btn-save:hover { opacity: 0.85; }

  /* ── USER MODAL ── */
  .user-modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    width: 100%; max-width: 320px;
    padding: 24px;
    text-align: center;
  }
  .user-modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .user-modal p { font-size: 12px; color: var(--muted); margin-bottom: 18px; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); padding: 9px 18px; border-radius: 20px;
    font-size: 12px; font-family: var(--mono);
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200;
  }
  #toast.show { opacity: 1; }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 40px; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .toolbar { gap: 6px; }
    .main { padding: 14px; }
  }
</style>
</head>
<body>

<!-- USER SELECTION OVERLAY -->
<div class="overlay open" id="userOverlay">
  <div class="user-modal">
    <h2>¿Quién eres?</h2>
    <p>Tu nombre aparecerá en las notas y cambios que hagas.</p>
    <div class="field" style="text-align:left">
      <label>Tu nombre</label>
      <input type="text" id="nameInput" placeholder="ej. Luis, Roberto…" maxlength="30" autocomplete="off">
    </div>
    <button class="btn-save" style="width:100%" onclick="setUser()">Entrar</button>
  </div>
</div>

<!-- NEW/EDIT ITEM MODAL -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Nuevo pendiente</div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="fTitle" placeholder="¿Qué hay que hacer?" maxlength="100">
    </div>
    <div class="field">
      <label>Descripción (opcional)</label>
      <textarea id="fDesc" placeholder="Detalles, contexto…"></textarea>
    </div>
    <div class="field">
      <label>Prioridad</label>
      <div class="priority-row">
        <div class="priority-option selected" data-v="alta"   onclick="selectPrio(this)">🔴 Urgente</div>
        <div class="priority-option"          data-v="media"  onclick="selectPrio(this)">🟡 Normal</div>
        <div class="priority-option"          data-v="baja"   onclick="selectPrio(this)">🟢 Sin prisa</div>
      </div>
    </div>
    <div class="field">
      <label>Estado</label>
      <select id="fStatus">
        <option value="pendiente">Pendiente</option>
        <option value="progreso">En progreso</option>
        <option value="listo">Listo</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeItemModal()">Cancelar</button>
      <button class="btn-save" onclick="saveItem()">Guardar</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header>
  <span class="logo">// PENDIENTES</span>
  <div class="user-pill" onclick="changeUser()">
    <span class="user-dot"></span>
    <span id="userLabel">—</span>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
  <button class="filter-btn" onclick="setFilter('pendiente', this)">Pendientes</button>
  <button class="filter-btn" onclick="setFilter('progreso', this)">En progreso</button>
  <button class="filter-btn" onclick="setFilter('listo', this)">Listos</button>
  <div class="spacer"></div>
  <button class="btn-new" onclick="openNewModal()">＋ Nuevo</button>
</div>

<!-- MAIN -->
<div class="main" id="mainContent">
  <div class="loading">Cargando…</div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://sakrwpdlymstexmshjay.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNha3J3cGRseW1zdGV4bXNoamF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTM4MzUsImV4cCI6MjA5NjYyOTgzNX0.lb8Xd8GPjJlrfqGyZ-O74RMS2o5wAyC2WyXw1FPcETs';
// ────────────────────────────────────────────────────

let currentUser = localStorage.getItem('pendientes_user') || '';
let currentFilter = 'all';
let items = [];
let editingId = null;
let selectedPrio = 'alta';
let pollingInterval = null;

// ── USER ────────────────────────────────────────────
function setUser() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v) return;
  currentUser = v;
  localStorage.setItem('pendientes_user', v);
  document.getElementById('userLabel').textContent = v;
  document.getElementById('userOverlay').classList.remove('open');
  startApp();
}
function changeUser() {
  document.getElementById('nameInput').value = currentUser;
  document.getElementById('userOverlay').classList.add('open');
}
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') setUser(); });

// ── SUPABASE HELPERS ─────────────────────────────────
async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── LOAD & RENDER ────────────────────────────────────
async function loadItems() {
  try {
    const data = await sbFetch('/rest/v1/pendientes?order=created_at.desc&select=*,notas(*)');
    items = data || [];
    render();
  } catch(e) {
    console.error(e);
    document.getElementById('mainContent').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>No se pudo conectar. Verifica la Supabase Key.</div>`;
  }
}

function render() {
  const container = document.getElementById('mainContent');

  let filtered = currentFilter === 'all' ? items : items.filter(i => i.status === currentFilter);

  // Group by priority within each section
  const urgentes  = filtered.filter(i => i.priority === 'alta'  && i.status !== 'listo');
  const normales  = filtered.filter(i => i.priority === 'media' && i.status !== 'listo');
  const sinPrisa  = filtered.filter(i => i.priority === 'baja'  && i.status !== 'listo');
  const listos    = filtered.filter(i => i.status === 'listo');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">✓</div>Sin pendientes. Todo en orden.</div>`;
    return;
  }

  let html = '';

  if (currentFilter === 'all' || currentFilter === 'listo') {
    if (urgentes.length)  html += renderSection('Urgente', urgentes);
    if (normales.length)  html += renderSection('Normal', normales);
    if (sinPrisa.length)  html += renderSection('Sin prisa', sinPrisa);
    if (listos.length)    html += renderSection('Listo ✓', listos);
  } else {
    html += renderSection(currentFilter === 'pendiente' ? 'Pendientes' : currentFilter === 'progreso' ? 'En progreso' : 'Listos', filtered);
  }

  container.innerHTML = html;
}

function renderSection(label, arr) {
  return `<div class="section-label">${label}</div>` + arr.map(renderCard).join('');
}

function renderCard(item) {
  const pc = item.priority === 'alta' ? 'p-alta' : item.priority === 'media' ? 'p-media' : 'p-baja';
  const tc = item.status === 'listo' ? 'done' : '';
  const sc = `tag-status-${item.status}`;
  const sl = item.status === 'pendiente' ? 'Pendiente' : item.status === 'progreso' ? 'En progreso' : 'Listo';

  const notasHtml = (item.notas || []).sort((a,b) => new Date(a.created_at) - new Date(b.created_at)).map(n => `
    <div class="nota-item">
      <div class="nota-avatar">${n.author.substring(0,2).toUpperCase()}</div>
      <div class="nota-bubble">
        <div class="nota-meta">${n.author} · ${fmtDate(n.created_at)}</div>
        <div class="nota-text">${escHtml(n.content)}</div>
      </div>
    </div>`).join('');

  return `
  <div class="card" id="card-${item.id}" onclick="toggleCard('${item.id}', event)">
    <div class="card-header">
      <span class="priority-dot ${pc}"></span>
      <span class="card-title ${tc}">${escHtml(item.title)}</span>
      <div class="card-meta">
        <span class="tag tag-author">${escHtml(item.author)}</span>
        <span class="tag ${sc}">${sl}</span>
      </div>
      <span class="chevron">›</span>
    </div>
    <div class="card-body">
      ${item.description ? `<div class="card-desc">${escHtml(item.description)}</div>` : ''}
      <div class="card-actions">
        ${item.status !== 'progreso' ? `<button class="btn-sm" onclick="changeStatus('${item.id}','progreso')">→ En progreso</button>` : ''}
        ${item.status !== 'listo'    ? `<button class="btn-sm success" onclick="changeStatus('${item.id}','listo')">✓ Listo</button>` : ''}
        ${item.status !== 'pendiente'? `<button class="btn-sm" onclick="changeStatus('${item.id}','pendiente')">↩ Pendiente</button>` : ''}
        <button class="btn-sm" onclick="openEditModal('${item.id}')">Editar</button>
        <button class="btn-sm danger" onclick="deleteItem('${item.id}')">Eliminar</button>
      </div>
      <div class="notas-section">
        <div class="notas-title">Notas y avances</div>
        <div id="notas-${item.id}">${notasHtml || '<div style="color:var(--muted);font-size:12px;padding:4px 0">Sin notas aún.</div>'}</div>
        <div class="nota-input-row">
          <input class="nota-input" id="notaInput-${item.id}" placeholder="Dejar un avance…" maxlength="400" onkeydown="if(event.key==='Enter')addNota('${item.id}')">
          <button class="btn-nota" onclick="addNota('${item.id}')">Enviar</button>
        </div>
      </div>
    </div>
  </div>`;
}

// ── INTERACTIONS ─────────────────────────────────────
function toggleCard(id, e) {
  if (e.target.closest('.card-actions') || e.target.closest('.nota-input-row')) return;
  const card = document.getElementById('card-' + id);
  card.classList.toggle('expanded');
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── ITEM CRUD ─────────────────────────────────────────
function openNewModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Nuevo pendiente';
  document.getElementById('fTitle').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fStatus').value = 'pendiente';
  selectPrioByValue('alta');
  document.getElementById('itemOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 100);
}
function openEditModal(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Editar pendiente';
  document.getElementById('fTitle').value = item.title;
  document.getElementById('fDesc').value = item.description || '';
  document.getElementById('fStatus').value = item.status;
  selectPrioByValue(item.priority);
  document.getElementById('itemOverlay').classList.add('open');
}
function closeItemModal() { document.getElementById('itemOverlay').classList.remove('open'); }

function selectPrio(el) {
  document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedPrio = el.dataset.v;
}
function selectPrioByValue(v) {
  document.querySelectorAll('.priority-option').forEach(o => {
    o.classList.toggle('selected', o.dataset.v === v);
  });
  selectedPrio = v;
}

async function saveItem() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('El título es requerido'); return; }

  const payload = {
    title,
    description: document.getElementById('fDesc').value.trim() || null,
    priority: selectedPrio,
    status: document.getElementById('fStatus').value,
    author: currentUser
  };

  try {
    if (editingId) {
      await sbFetch(`/rest/v1/pendientes?id=eq.${editingId}`, {
        method: 'PATCH',
        prefer: 'return=minimal',
        body: JSON.stringify(payload)
      });
      toast('Pendiente actualizado');
    } else {
      await sbFetch('/rest/v1/pendientes', {
        method: 'POST',
        prefer: 'return=minimal',
        body: JSON.stringify(payload)
      });
      toast('Pendiente creado');
    }
    closeItemModal();
    await loadItems();
  } catch(e) { toast('Error al guardar'); console.error(e); }
}

async function deleteItem(id) {
  if (!confirm('¿Eliminar este pendiente y sus notas?')) return;
  try {
    await sbFetch(`/rest/v1/notas?item_id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    await sbFetch(`/rest/v1/pendientes?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    toast('Eliminado');
    await loadItems();
  } catch(e) { toast('Error al eliminar'); console.error(e); }
}

async function changeStatus(id, status) {
  try {
    await sbFetch(`/rest/v1/pendientes?id=eq.${id}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: JSON.stringify({ status })
    });
    await loadItems();
  } catch(e) { toast('Error'); }
}

// ── NOTAS ─────────────────────────────────────────────
async function addNota(itemId) {
  const input = document.getElementById('notaInput-' + itemId);
  const content = input.value.trim();
  if (!content) return;
  try {
    await sbFetch('/rest/v1/notas', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({ item_id: itemId, content, author: currentUser })
    });
    input.value = '';
    await loadItems();
    // Re-expand card
    setTimeout(() => {
      const card = document.getElementById('card-' + itemId);
      if (card && !card.classList.contains('expanded')) card.classList.add('expanded');
    }, 50);
  } catch(e) { toast('Error al guardar nota'); }
}

// ── HELPERS ───────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short' }) + ' ' +
    d.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── INIT ──────────────────────────────────────────────
function startApp() {
  document.getElementById('userLabel').textContent = currentUser;
  loadItems();
  // Poll every 15s for shared updates
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(loadItems, 15000);
}

if (currentUser) {
  document.getElementById('userOverlay').classList.remove('open');
  startApp();
} else {
  document.getElementById('userOverlay').classList.add('open');
}
</script>
</body>
