<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mylo — Reservas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500&display=swap');

  :root {
    --black:   #0d0d0d;
    --dark:    #181818;
    --card:    #202020;
    --border:  #2e2e2e;
    --orange:  #E8621A;
    --orange2: #f07a3a;
    --teal:    #1B4D47;
    --cream:   #F2E8D5;
    --muted:   #777;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--cream); font-family: 'Barlow', sans-serif; font-size: 14px; min-height: 100vh; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 36px; border-bottom: 1px solid var(--border); background: var(--black); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 800; text-transform: uppercase; color: var(--orange); line-height: 1; }
  .brand-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  .btn-primary { background: var(--orange); color: #fff; border: none; padding: 10px 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: var(--orange2); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 10px 18px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .btn-ghost:hover { border-color: var(--orange); color: var(--orange); }

  .stats-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--dark); }
  .stat { flex: 1; padding: 14px 28px; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: none; }
  .stat-num { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; color: var(--orange); line-height: 1; }
  .stat-label { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 3px; }

  .sync-bar { display: flex; align-items: center; gap: 8px; padding: 7px 36px; background: #111; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #444; transition: background 0.3s; }
  .sync-dot.ok { background: #2e7d5e; }
  .sync-dot.loading { background: var(--orange); animation: pulse 1s infinite; }
  .sync-dot.error { background: #c0392b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  main { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 155px); }

  .calendar-panel { padding: 28px 36px; border-right: 1px solid var(--border); overflow-y: auto; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .month-title { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; color: var(--cream); }
  .month-title em { color: var(--orange); font-style: normal; }
  .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--cream); width: 38px; height: 38px; cursor: pointer; font-size: 18px; transition: all 0.18s; display: flex; align-items: center; justify-content: center; }
  .nav-btn:hover { border-color: var(--orange); color: var(--orange); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { text-align: center; padding: 8px 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .cal-day { background: var(--card); min-height: 88px; padding: 9px 8px 7px; cursor: pointer; transition: background 0.15s; }
  .cal-day:hover { background: #282828; }
  .cal-day.empty { background: #141414; cursor: default; }
  .cal-day.today { background: #1e1e1e; border-top: 2px solid var(--orange); }
  .cal-day.selected { background: #1a1208; outline: 2px solid var(--orange); }
  .day-num { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: var(--cream); margin-bottom: 5px; line-height: 1; }
  .cal-day.today .day-num { color: var(--orange); }
  .cal-day.empty .day-num { color: #333; }
  .res-dots { display: flex; flex-direction: column; gap: 2px; }
  .res-chip { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .res-chip.confirmed { background: var(--teal); color: #a8d5c8; }
  .res-chip.pending   { background: #3d2a0a; color: #f0b860; }
  .res-chip.cancelled { background: #2a2a2a; color: #555; text-decoration: line-through; }
  .more-chip { font-size: 10px; color: var(--muted); padding: 1px 4px; font-family: 'Barlow Condensed', sans-serif; }

  .detail-panel { background: var(--dark); overflow-y: auto; display: flex; flex-direction: column; }
  .detail-header { padding: 22px 24px 16px; border-bottom: 1px solid var(--border); }
  .detail-date { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--cream); }
  .detail-date em { color: var(--orange); font-style: normal; }
  .detail-count { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .detail-body { padding: 16px 24px; flex: 1; }

  .res-card { border: 1px solid var(--border); margin-bottom: 10px; padding: 14px; cursor: pointer; transition: border-color 0.2s; }
  .res-card:hover { border-color: var(--orange); }
  .res-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .res-name { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--cream); line-height: 1.1; }
  .status-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; white-space: nowrap; }
  .status-badge.confirmed { background: var(--teal); color: #a8d5c8; }
  .status-badge.pending   { background: #3d2a0a; color: #f0b860; }
  .status-badge.cancelled { background: #2a2a2a; color: #555; }
  .res-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .meta-item { display: flex; flex-direction: column; gap: 1px; }
  .meta-label { font-size: 9px; font-weight: 600; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif; }
  .meta-value { font-size: 13px; color: var(--cream); }
  .res-notes { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: #999; line-height: 1.5; }

  .empty-day { text-align: center; padding: 60px 20px; color: #444; }
  .empty-icon { font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 800; color: #2a2a2a; letter-spacing: -0.02em; }
  .empty-day p { font-size: 12px; margin-top: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark); border: 1px solid var(--border); width: 500px; max-width: 96vw; max-height: 92vh; overflow-y: auto; }
  .modal-header { padding: 20px 24px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--card); }
  .modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--orange); }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--cream); }
  .modal-body { padding: 20px 24px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  input, select, textarea { background: #151515; border: 1px solid var(--border); color: var(--cream); padding: 10px 12px; font-family: 'Barlow', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; width: 100%; -webkit-appearance: none; border-radius: 0; }
  input:focus, select:focus, textarea:focus { border-color: var(--orange); }
  select option { background: #151515; }
  textarea { resize: vertical; min-height: 68px; }
  .modal-footer { padding: 14px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
  .delete-btn { background: transparent; color: #c0392b; border: 1px solid #3a1515; padding: 10px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-right: auto; transition: all 0.2s; }
  .delete-btn:hover { border-color: #c0392b; background: #1a0a0a; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; height: auto; }
    .detail-panel { border-top: 1px solid var(--border); min-height: 300px; }
    header { padding: 14px 16px; }
    .calendar-panel { padding: 16px; }
    .sync-bar { padding: 7px 16px; }
    .stats-bar { flex-wrap: wrap; }
    .stat { flex: 1 1 50%; min-width: 120px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">mylo</div>
    <div class="brand-sub">Reservaciones</div>
  </div>
  <div class="header-actions">
    <button class="btn-ghost" onclick="exportData()">Exportar CSV</button>
    <button class="btn-primary" onclick="openModal()">+ Nueva reserva</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Este mes</div></div>
  <div class="stat"><div class="stat-num" id="stat-confirmed">—</div><div class="stat-label">Confirmadas</div></div>
  <div class="stat"><div class="stat-num" id="stat-pending">—</div><div class="stat-label">Pendientes</div></div>
  <div class="stat"><div class="stat-num" id="stat-covers">—</div><div class="stat-label">Cubiertos</div></div>
</div>

<div class="sync-bar">
  <div class="sync-dot loading" id="sync-dot"></div>
  <span id="sync-label">Conectando...</span>
</div>

<main>
  <div class="calendar-panel">
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
      <div class="month-title" id="month-title"></div>
      <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div class="detail-panel">
    <div class="detail-header">
      <div class="detail-date" id="detail-date">Selecciona un día</div>
      <div class="detail-count" id="detail-count"></div>
    </div>
    <div class="detail-body" id="detail-body">
      <div class="empty-day"><div class="empty-icon">NO<br>RES.</div><p>Selecciona un día</p></div>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Nueva Reserva</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Nombre</label><input type="text" id="f-name" placeholder="Nombre del comensal"></div>
        <div class="form-group"><label>Teléfono</label><input type="tel" id="f-phone" placeholder="+52 998..."></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Fecha</label><input type="date" id="f-date"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="f-time" value="20:00"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Personas</label><input type="number" id="f-pax" min="1" max="30" value="2"></div>
        <div class="form-group"><label>Mesa / Zona</label>
          <select id="f-table">
            <option value="">Sin asignar</option>
            <option>Mesa 1</option><option>Mesa 2</option><option>Mesa 3</option>
            <option>Mesa 4</option><option>Mesa 5</option><option>Mesa 6</option>
            <option>Terraza</option><option>Jardín</option><option>Barra</option><option>Privado</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Estado</label>
          <select id="f-status">
            <option value="pending">Pendiente</option>
            <option value="confirmed">Confirmada</option>
            <option value="cancelled">Cancelada</option>
          </select>
        </div>
        <div class="form-group"><label>Ocasión</label>
          <select id="f-occasion">
            <option value="">—</option>
            <option>Cumpleaños</option><option>Aniversario</option>
            <option>Negocio</option><option>Evento especial</option><option>Despedida</option>
          </select>
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group"><label>Notas</label><textarea id="f-notes" placeholder="Alergias, preferencias, peticiones especiales…"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="delete-btn" id="delete-btn" onclick="deleteReservation()" style="display:none">Eliminar</button>
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveReservation()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── SUPABASE CONFIG ──
const SUPA_URL = 'https://sakrwpdlymstexmshjay.supabase.co';
const SUPA_KEY = 'sb_publishable_1vIabk5n0KaOZfO8bBCTbg_n7__6_Ab';
const TABLE    = 'reservaciones_mylo';

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

// ── APP STATE ──
const DAYS   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let currentYear, currentMonth, selectedDate = null, editingId = null;
let reservations = [];

function setSync(state, label) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('sync-label').textContent = label;
}

async function loadReservations() {
  try {
    setSync('loading', 'Sincronizando...');
    const data = await sbFetch(`${TABLE}?select=*&order=date.asc,time.asc`);
    reservations = data.map(r => ({
      id: r.id,
      name: r.name,
      phone: r.phone || '',
      date: r.date,
      time: r.time ? r.time.slice(0,5) : '',
      pax: r.pax || 2,
      table: r.mesa || '',
      status: r.status || 'pending',
      occasion: r.occasion || '',
      notes: r.notes || ''
    }));
    setSync('ok', 'Sincronizado');
    renderCalendar();
    if (selectedDate) renderDetail(selectedDate);
    updateStats();
  } catch(e) {
    setSync('error', 'Error de conexión');
    console.error(e);
  }
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function init() {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  selectedDate = formatDate(now);
  renderCalendar();
  renderDetail(selectedDate);
  loadReservations();
  // Refresca cada 30 segundos para ver cambios de otros dispositivos
  setInterval(loadReservations, 30000);
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderCalendar();
  updateStats();
}

function renderCalendar() {
  document.getElementById('month-title').innerHTML =
    `<em>${MONTHS[currentMonth].toUpperCase()}</em> ${currentYear}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const today       = formatDate(new Date());
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    const n = document.createElement('div');
    n.className = 'day-num';
    el.appendChild(n);
    grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayRes = reservations.filter(r => r.date === ds);
    const el = document.createElement('div');
    el.className = 'cal-day' + (ds===today?' today':'') + (ds===selectedDate?' selected':'');
    el.onclick = () => {
      document.querySelectorAll('.cal-day.selected').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedDate = ds;
      renderDetail(ds);
    };
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    el.appendChild(num);
    if (dayRes.length > 0) {
      const dots = document.createElement('div');
      dots.className = 'res-dots';
      dayRes.slice(0,2).forEach(r => {
        const chip = document.createElement('div');
        chip.className = `res-chip ${r.status}`;
        chip.textContent = `${r.time} ${r.name.split(' ')[0]}`;
        dots.appendChild(chip);
      });
      if (dayRes.length > 2) {
        const more = document.createElement('div');
        more.className = 'more-chip';
        more.textContent = `+${dayRes.length-2} más`;
        dots.appendChild(more);
      }
      el.appendChild(dots);
    }
    grid.appendChild(el);
  }
}

function renderDetail(ds) {
  if (!ds) return;
  const [y,m,d] = ds.split('-');
  const obj = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  const dayName = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][obj.getDay()];
  document.getElementById('detail-date').innerHTML =
    `<em>${dayName.toUpperCase()}</em> ${parseInt(d)} ${MONTHS[parseInt(m)-1].toUpperCase()}`;
  const dayRes = reservations.filter(r => r.date === ds).sort((a,b) => a.time.localeCompare(b.time));
  const covers = dayRes.reduce((s,r) => s+parseInt(r.pax||0), 0);
  document.getElementById('detail-count').textContent =
    dayRes.length===0 ? 'Sin reservas' : `${dayRes.length} reserva${dayRes.length>1?'s':''} · ${covers} cubiertos`;
  const body = document.getElementById('detail-body');
  if (dayRes.length === 0) {
    body.innerHTML = `<div class="empty-day"><div class="empty-icon">SIN<br>RES.</div><p>No hay reservas este día</p></div>`;
    return;
  }
  const statLabel = { confirmed:'Confirmada', pending:'Pendiente', cancelled:'Cancelada' };
  body.innerHTML = dayRes.map(r => `
    <div class="res-card" onclick="editReservation(${r.id})">
      <div class="res-card-top">
        <div class="res-name">${r.name}</div>
        <div class="status-badge ${r.status}">${statLabel[r.status]}</div>
      </div>
      <div class="res-meta">
        <div class="meta-item"><span class="meta-label">Hora</span><span class="meta-value">${r.time}</span></div>
        <div class="meta-item"><span class="meta-label">Personas</span><span class="meta-value">${r.pax} pax</span></div>
        <div class="meta-item"><span class="meta-label">Mesa</span><span class="meta-value">${r.table||'—'}</span></div>
        <div class="meta-item"><span class="meta-label">Tel</span><span class="meta-value">${r.phone||'—'}</span></div>
        ${r.occasion?`<div class="meta-item"><span class="meta-label">Ocasión</span><span class="meta-value">${r.occasion}</span></div>`:''}
      </div>
      ${r.notes?`<div class="res-notes">${r.notes}</div>`:''}
    </div>
  `).join('');
}

function updateStats() {
  const mo = reservations.filter(r => {
    const [y,m] = r.date.split('-');
    return parseInt(y)===currentYear && parseInt(m)-1===currentMonth;
  });
  document.getElementById('stat-total').textContent     = mo.length;
  document.getElementById('stat-confirmed').textContent = mo.filter(r=>r.status==='confirmed').length;
  document.getElementById('stat-pending').textContent   = mo.filter(r=>r.status==='pending').length;
  document.getElementById('stat-covers').textContent    = mo.reduce((s,r)=>s+parseInt(r.pax||0),0);
}

function openModal(date) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'NUEVA RESERVA';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('f-name').value     = '';
  document.getElementById('f-phone').value    = '';
  document.getElementById('f-date').value     = date || selectedDate || formatDate(new Date());
  document.getElementById('f-time').value     = '20:00';
  document.getElementById('f-pax').value      = '2';
  document.getElementById('f-table').value    = '';
  document.getElementById('f-status').value   = 'pending';
  document.getElementById('f-occasion').value = '';
  document.getElementById('f-notes').value    = '';
  document.getElementById('modal').classList.add('open');
}

function editReservation(id) {
  const r = reservations.find(x => x.id===id);
  if (!r) return;
  editingId = id;
  document.getElementById('modal-title').textContent   = 'EDITAR RESERVA';
  document.getElementById('delete-btn').style.display  = '';
  document.getElementById('f-name').value     = r.name;
  document.getElementById('f-phone').value    = r.phone||'';
  document.getElementById('f-date').value     = r.date;
  document.getElementById('f-time').value     = r.time;
  document.getElementById('f-pax').value      = r.pax;
  document.getElementById('f-table').value    = r.table||'';
  document.getElementById('f-status').value   = r.status;
  document.getElementById('f-occasion').value = r.occasion||'';
  document.getElementById('f-notes').value    = r.notes||'';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveReservation() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('El nombre es requerido'); return; }
  const data = {
    name,
    phone:    document.getElementById('f-phone').value.trim(),
    date:     document.getElementById('f-date').value,
    time:     document.getElementById('f-time').value + ':00',
    pax:      parseInt(document.getElementById('f-pax').value)||2,
    mesa:     document.getElementById('f-table').value,
    status:   document.getElementById('f-status').value,
    occasion: document.getElementById('f-occasion').value,
    notes:    document.getElementById('f-notes').value.trim(),
  };
  try {
    setSync('loading', 'Guardando...');
    if (editingId) {
      await sbFetch(`${TABLE}?id=eq.${editingId}`, { method: 'PATCH', body: JSON.stringify(data) });
    } else {
      await sbFetch(TABLE, { method: 'POST', body: JSON.stringify(data) });
    }
    closeModal();
    await loadReservations();
  } catch(e) {
    setSync('error', 'Error al guardar');
    alert('Error al guardar: ' + e.message);
  }
}

async function deleteReservation() {
  if (!editingId) return;
  if (!confirm('¿Eliminar esta reserva?')) return;
  try {
    setSync('loading', 'Eliminando...');
    await sbFetch(`${TABLE}?id=eq.${editingId}`, { method: 'DELETE', prefer: 'return=minimal' });
    closeModal();
    await loadReservations();
  } catch(e) {
    setSync('error', 'Error al eliminar');
    alert('Error: ' + e.message);
  }
}

function exportData() {
  const csv = ['Nombre,Teléfono,Fecha,Hora,Personas,Mesa,Estado,Ocasión,Notas',
    ...reservations.map(r => `"${r.name}","${r.phone||''}","${r.date}","${r.time}","${r.pax}","${r.table||''}","${r.status}","${r.occasion||''}","${r.notes||''}"`)
  ].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = `mylo_reservas_${MONTHS[currentMonth].toLowerCase()}_${currentYear}.csv`;
  a.click();
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target===document.getElementById('modal')) closeModal();
});

init();
</script>
</body>
</html>
